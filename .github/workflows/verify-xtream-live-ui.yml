name: Verify Xtream Live UI Performance

on:
  pull_request:
    paths:
      - 'tests/xtream-live-browser-proof.mjs'
      - '.github/workflows/verify-xtream-live-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WEBV2_URL: https://tonis1000.github.io/WebV2/
      XTREAM_MOCK_URL: https://webtv-xtream-mock.atonis.workers.dev
      ARTIFACT_DIR: artifacts/xtream-live-ui-proof

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify production page and live authorized mock provider
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "$WEBV2_URL" -o /tmp/webv2-live.html
          grep -q '<title>WebTV V2</title>' /tmp/webv2-live.html
          curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "$WEBV2_URL/src/known-source-collector.js?proof=$GITHUB_SHA" -o /tmp/known-source-live.js
          grep -q 'function identityKeys' /tmp/known-source-live.js
          echo 'Live Pages serves identityKeys collector fix'
          curl --fail --silent --show-error "$XTREAM_MOCK_URL/api/status?verify=$GITHUB_SHA" -o /tmp/xtream-mock-status.json
          node -e "const j=require('/tmp/xtream-mock-status.json');if(j.version!=='1.2'||j.service!=='WebTV Xtream Test Provider')process.exit(1);console.log('Live mock provider v1.2 ready')"

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run production Xtream browser proof
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/xtream-live-browser-proof.mjs')
          s=p.read_text()
          replacements=[
            ("const context = await browser.newContext({ viewport: { width: 1440, height: 1100 } });", "const context = await browser.newContext({ viewport: { width: 1440, height: 1100 } });\nawait context.setExtraHTTPHeaders({ 'cache-control': 'no-cache', pragma: 'no-cache' });"),
            ("await page.waitForSelector('#playlist-manager-toggle', { timeout: 20_000 });", "await page.waitForSelector('#playlist-manager-toggle', { state: 'attached', timeout: 20_000 });"),
            ("await page.evaluate(() => document.documentElement.classList.add('admin-unlocked'));", "await page.evaluate(() => { document.documentElement.classList.remove('admin-locked'); document.documentElement.classList.add('admin-unlocked'); });"),
            ("return json(route, { status: 'VERIFIED', verified: true, detail: 'CI browser proof verified mock preview' });", "return json(route, { results: [{ status: 'VERIFIED', verified: true, detail: 'CI browser proof verified mock preview' }] });"),
            ("await page.waitForFunction(() => document.getElementById('xtream-status')?.textContent?.includes('selected source'), null, { timeout: 10_000 });", "await page.waitForFunction(() => document.getElementById('xtream-status')?.textContent?.includes('selected source'), null, { timeout: 10_000 });\nassert.equal(await page.locator('#playlist-manager').evaluate(el => el.hidden), false, 'Playlist Manager must remain open after selected-source save');"),
            ("await page.locator('input[name=\"xtream-save-source-scope\"][value=\"all-known\"]').check();", "await page.locator('input[name=\"xtream-save-source-scope\"][value=\"all-known\"]').check();\nconst debugBeforeAll = await page.evaluate(async () => ({\n  my: await window.WebTVMyPlaylistAPI?.getMyPlaylist?.(),\n  preview: window.WebTVXtream?.getPreview?.(),\n  loaded: (window.WebTVPlaylistAPI?.getChannels?.() || []).slice(0, 3),\n}));\nconsole.log('ALL_KNOWN_CONTEXT '+JSON.stringify(debugBeforeAll));"),
            ("await page.waitForFunction(() => document.getElementById('xtream-status')?.textContent?.includes('all known sources'), null, { timeout: 10_000 });", "await page.waitForFunction(() => document.getElementById('xtream-status')?.textContent?.includes('all known sources'), null, { timeout: 10_000 });\nassert.equal(await page.locator('#playlist-manager').evaluate(el => el.hidden), false, 'Playlist Manager must remain open after all-known save');\nconst allKnownWrite = [...writes].reverse().find(item => item.target === 'custom-channel');\nconsole.log('ALL_KNOWN_WRITE '+JSON.stringify(allKnownWrite));"),
          ]
          for old,new in replacements:
              if old not in s:
                  raise SystemExit('expected browser-proof harness line not found: '+old)
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node tests/xtream-live-browser-proof.mjs

      - name: Upload browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xtream-live-ui-proof-${{ github.sha }}
          path: artifacts/xtream-live-ui-proof
          if-no-files-found: warn
          retention-days: 14
