name: Append Phase 4.6 Manual

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/append-phase46-manual.yml'
      - 'tmp/phase46-authorized-xtream-section.md'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Append Phase 4.6 operations section
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '^## 27\. Source Discovery V2 Phase 4 provider #6' WEBTV_OPERATIONS.md; then
            echo 'Section 27 already present; nothing to append.'
            exit 0
          fi
          cat tmp/phase46-authorized-xtream-section.md >> WEBTV_OPERATIONS.md
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add WEBTV_OPERATIONS.md
          git commit -m 'Document Phase 4.6 authorized Xtream expansion'
          git push origin HEAD:main
