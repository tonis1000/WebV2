name: Validate WebTV Frontend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/**/*.js'
      - 'tests/**/*.mjs'
      - 'workers/webtv-xtream.js'
      - 'workers/webtv-xtream-router.js'
      - 'workers/xtream-preview-routes.js'
      - 'workers/webtv-source-verifier.js'
      - 'workers/webtv-source-discovery.js'
      - 'workers/source-discovery/**/*.js'
      - 'WEBTV_OPERATIONS.md'
      - '.github/workflows/validate-frontend.yml'
      - '.github/workflows/deploy-webtv-xtream.yml'
      - '.github/workflows/deploy-source-verifier.yml'
      - '.github/workflows/deploy-source-discovery.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'src/**/*.js'
      - 'tests/**/*.mjs'
      - 'workers/webtv-xtream.js'
      - 'workers/webtv-xtream-router.js'
      - 'workers/xtream-preview-routes.js'
      - 'workers/webtv-source-verifier.js'
      - 'workers/webtv-source-discovery.js'
      - 'workers/source-discovery/**/*.js'
      - 'WEBTV_OPERATIONS.md'
      - '.github/workflows/validate-frontend.yml'
      - '.github/workflows/deploy-webtv-xtream.yml'
      - '.github/workflows/deploy-source-verifier.yml'
      - '.github/workflows/deploy-source-discovery.yml'

permissions:
  contents: read

concurrency:
  group: validate-webtv-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Validate all frontend JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do echo "Checking $file"; node --check "$file"; done < <(find src -type f -name '*.js' | sort)
      - name: Validate Xtream Worker syntax
        shell: bash
        run: |
          node --input-type=module --check < workers/webtv-xtream.js
          node --check workers/xtream-preview-routes.js
          node --check workers/webtv-xtream-router.js
      - name: Validate Source Verifier Worker syntax
        run: node --input-type=module --check < workers/webtv-source-verifier.js
      - name: Validate Source Discovery Worker syntax
        shell: bash
        run: |
          node --input-type=module --check < workers/webtv-source-discovery.js
          while IFS= read -r file; do echo "Checking $file"; node --check "$file"; done < <(find workers/source-discovery -type f -name '*.js' | sort)
      - name: Run playback and fallback regression tests
        run: node tests/header-aware-proxy.test.mjs
      - name: Run source ranking regression test
        run: node tests/source-ranking.test.mjs
      - name: Run Xtream source regression test
        run: node tests/xtream-client.test.mjs
      - name: Run Xtream preview route encryption regression test
        run: node tests/xtream-preview-routes.test.mjs
      - name: Run Xtream channel cleanup route regression test
        run: node tests/xtream-channel-cleanup-route.test.mjs
      - name: Run Xtream channel lifecycle regression test
        run: node tests/xtream-channel-lifecycle.test.mjs
      - name: Run authorized Xtream discovery regression test
        run: node tests/authorized-xtream-discovery.test.mjs
      - name: Run new Xtream preview candidate regression test
        run: node tests/new-xtream-preview.test.mjs
      - name: Run explicit Discovery promotion regression test
        run: node tests/discovery-promotion.test.mjs
      - name: Run Discovery candidate/state regression test
        run: node tests/discovery-candidate.test.mjs
      - name: Run Discovery local-source regression test
        run: node tests/discovery-local-sources.test.mjs
      - name: Run Discovery verifier client regression test
        run: node tests/discovery-verifier.test.mjs
      - name: Run Source Verifier Worker regression test
        run: node tests/source-verifier-worker.test.mjs
      - name: Run external discovery client regression test
        run: node tests/discovery-external.test.mjs
      - name: Run Source Discovery Worker regression test
        run: node tests/source-discovery-worker.test.mjs
      - name: Run GitHub public playlist provider regression test
        run: node tests/github-public-playlists-provider.test.mjs
      - name: Run recent web search provider regression test
        run: node tests/recent-web-search-provider.test.mjs
      - name: Run STRM-specific discovery provider regression test
        run: node tests/strm-specific-discovery-provider.test.mjs
      - name: Run official provider lane regression test
        run: node tests/official-provider-lane.test.mjs
      - name: Run Discovery Phase 4 isolation regression test
        run: node tests/discovery-isolation.test.mjs
      - name: Run Discovery Phase 5 browser smoke test
        run: node tests/discovery-browser-smoke.mjs
      - name: Run frontend integration audit
        run: node tests/frontend-integration.test.mjs
