name: Validate WebTV Frontend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/**/*.js'
      - 'tests/**/*.mjs'
      - 'tests/**/*.html'
      - 'WEBV2_*.md'
      - 'workers/webtv-registry.js'
      - 'workers/webtv-registry-entry.js'
      - 'workers/custom-playlist-routes.js'
      - 'workers/webtv-xtream.js'
      - 'workers/webtv-xtream-router.js'
      - 'workers/xtream-preview-routes.js'
      - 'workers/webtv-xtream-mock.js'
      - 'workers/webtv-source-verifier.js'
      - 'workers/webtv-source-discovery.js'
      - 'workers/source-discovery/**/*.js'
      - 'workers/source-hunt*.js'
      - 'workers/epg-proxy-gr.js'
      - 'WEBTV_OPERATIONS.md'
      - '.github/workflows/validate-frontend.yml'
      - '.github/workflows/deploy-webtv-registry.yml'
      - '.github/workflows/deploy-webtv-xtream.yml'
      - '.github/workflows/deploy-webtv-xtream-mock.yml'
      - '.github/workflows/deploy-source-verifier.yml'
      - '.github/workflows/deploy-source-discovery.yml'
      - '.github/workflows/deploy-source-hunt.yml'
      - '.github/workflows/deploy-epg-proxy-gr.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'src/**/*.js'
      - 'tests/**/*.mjs'
      - 'tests/**/*.html'
      - 'WEBV2_*.md'
      - 'workers/webtv-registry.js'
      - 'workers/webtv-registry-entry.js'
      - 'workers/custom-playlist-routes.js'
      - 'workers/webtv-xtream.js'
      - 'workers/webtv-xtream-router.js'
      - 'workers/xtream-preview-routes.js'
      - 'workers/webtv-xtream-mock.js'
      - 'workers/webtv-source-verifier.js'
      - 'workers/webtv-source-discovery.js'
      - 'workers/source-discovery/**/*.js'
      - 'workers/source-hunt*.js'
      - 'workers/epg-proxy-gr.js'
      - 'WEBTV_OPERATIONS.md'
      - '.github/workflows/validate-frontend.yml'
      - '.github/workflows/deploy-webtv-registry.yml'
      - '.github/workflows/deploy-webtv-xtream.yml'
      - '.github/workflows/deploy-webtv-xtream-mock.yml'
      - '.github/workflows/deploy-source-verifier.yml'
      - '.github/workflows/deploy-source-discovery.yml'
      - '.github/workflows/deploy-source-hunt.yml'
      - '.github/workflows/deploy-epg-proxy-gr.yml'

permissions:
  contents: read

concurrency:
  group: validate-webtv-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Validate all frontend JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do echo "Checking $file"; node --check "$file"; done < <(find src -type f -name '*.js' | sort)
      - name: Validate Registry Worker syntax
        shell: bash
        run: |
          node --input-type=module --check < workers/webtv-registry.js
          node --input-type=module --check < workers/webtv-registry-entry.js
          node --check workers/custom-playlist-routes.js
      - name: Validate Xtream Worker syntax
        shell: bash
        run: |
          node --input-type=module --check < workers/webtv-xtream.js
          node --check workers/xtream-preview-routes.js
          node --check workers/webtv-xtream-router.js
          node --input-type=module --check < workers/webtv-xtream-mock.js
      - name: Validate Source Verifier Worker syntax
        run: node --input-type=module --check < workers/webtv-source-verifier.js
      - name: Validate Source Discovery Worker syntax
        shell: bash
        run: |
          node --input-type=module --check < workers/webtv-source-discovery.js
          while IFS= read -r file; do echo "Checking $file"; node --check "$file"; done < <(find workers/source-discovery -type f -name '*.js' | sort)
      - name: Validate Source Hunt Worker syntax
        shell: bash
        run: |
          node --input-type=module --check < workers/source-huntatonisworkersdev.js
          node --input-type=module --check < workers/source-hunt-smart.js
          node --input-type=module --check < workers/source-hunt-bouquet-proxy.js
      - name: Validate EPG Proxy Worker syntax
        run: node --check workers/epg-proxy-gr.js
      - name: Run Project Brain documentation contract
        run: node tests/project-brain-docs.test.mjs
      - name: Run Registry project checkpoint write API regression test
        run: node tests/project-checkpoint-write-api.test.mjs
      - name: Run custom playlist Registry regression test
        run: node tests/custom-playlist-registry.test.mjs
      - name: Run custom playlist client regression test
        run: node tests/custom-playlist-client.test.mjs
      - name: Run custom playlist cache regression test
        run: node tests/custom-playlist-cache.test.mjs
      - name: Run playlist manager escaping regression test
