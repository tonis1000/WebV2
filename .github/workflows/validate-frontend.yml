name: Validate WebTV Frontend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/**/*.js'
      - 'tests/**/*.mjs'
      - 'workers/webtv-xtream.js'
      - 'WEBTV_OPERATIONS.md'
      - '.github/workflows/validate-frontend.yml'
      - '.github/workflows/deploy-webtv-xtream.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'src/**/*.js'
      - 'tests/**/*.mjs'
      - 'workers/webtv-xtream.js'
      - 'WEBTV_OPERATIONS.md'
      - '.github/workflows/validate-frontend.yml'
      - '.github/workflows/deploy-webtv-xtream.yml'

permissions:
  contents: read

concurrency:
  group: validate-webtv-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Validate all frontend JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find src -type f -name '*.js' | sort)

      - name: Validate Xtream Worker syntax
        run: node --input-type=module --check < workers/webtv-xtream.js

      - name: Run playback and fallback regression tests
        run: node tests/header-aware-proxy.test.mjs

      - name: Run source ranking regression test
        run: node tests/source-ranking.test.mjs

      - name: Run Xtream source regression test
        run: node tests/xtream-client.test.mjs

      - name: Run Discovery Phase 1 candidate/state regression test
        run: node tests/discovery-candidate.test.mjs

      - name: Run Discovery Phase 1 isolation regression test
        run: node tests/discovery-isolation.test.mjs

      - name: Run frontend integration audit
        run: node tests/frontend-integration.test.mjs
