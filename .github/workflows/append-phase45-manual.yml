name: Append Phase 4.5 Manual

on:
  push:
    branches: [phase45-official-provider]
    paths:
      - '.github/workflows/append-phase45-manual.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase45-official-provider
      - name: Append Phase 4.5 operations section
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '^## 26\. Source Discovery V2 Phase 4 provider #5' WEBTV_OPERATIONS.md; then
            echo 'Section 26 already present; nothing to append.'
            exit 0
          fi
          cat tmp/phase45-official-provider-section.md >> WEBTV_OPERATIONS.md
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add WEBTV_OPERATIONS.md
          git commit -m 'Document Phase 4.5 official provider lane'
          git push origin HEAD:phase45-official-provider
