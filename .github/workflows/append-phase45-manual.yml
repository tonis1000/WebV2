jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase45-official-provider
      - name: Append Phase 4.5 operations section
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '^## 26\. Source Discovery V2 Phase 4 provider #5' WEBTV_OPERATIONS.md; then
