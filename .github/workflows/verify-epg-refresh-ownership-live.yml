name: Verify EPG Refresh Ownership Live

on:
  pull_request:
    paths:
      - 'tests/epg-refresh-ownership-live-proof.mjs'
      - '.github/workflows/verify-epg-refresh-ownership-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WEBV2_URL: https://tonis1000.github.io/WebV2/
      REGISTRY_URL: https://webtv-registry.atonis.workers.dev
      EPG_STATUS_URL: https://epg-proxy-gr.atonis.workers.dev/status
      RUNTIME_SHA: 8815ac39b25cc82755dba8a7a37b2b1c8e7783a5
      ARTIFACT_DIR: artifacts/epg-refresh-ownership-live

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify exact production ownership is live
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --fail --silent --show-error -H 'Cache-Control: no-cache' "$REGISTRY_URL/api/project-status?proof=$GITHUB_SHA")"
          node -e "const j=JSON.parse(process.argv[1]);if(j.commitSha!==process.env.RUNTIME_SHA){console.error(j);process.exit(1)};console.log('Registry runtime SHA verified '+j.commitSha)" "$status"

          curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "$WEBV2_URL/src/sidebar-now.js?proof=$GITHUB_SHA" -o /tmp/sidebar-now-live.js
          ! grep -q 'epg.refresh(' /tmp/sidebar-now-live.js
          ! grep -q 'CONFIG.epgRefreshMs' /tmp/sidebar-now-live.js
          grep -q 'epg.get(channel)' /tmp/sidebar-now-live.js
          grep -q 'webtv:epg-updated' /tmp/sidebar-now-live.js

          curl --fail --silent --show-error -H 'Cache-Control: no-cache' "$EPG_STATUS_URL?proof=$GITHUB_SHA" -o /tmp/epg-status.json
          node -e "const j=JSON.parse(require('fs').readFileSync('/tmp/epg-status.json','utf8'));if(!j.ok||!j.valid||!(j.channels>0)||!(j.programmes>0)){console.error(j);process.exit(1)};console.log('EPG status verified',j.channels,j.programmes)"

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run production EPG ownership proof
        run: node tests/epg-refresh-ownership-live-proof.mjs

      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epg-refresh-ownership-live-${{ github.sha }}
          path: artifacts/epg-refresh-ownership-live
          if-no-files-found: warn
          retention-days: 14
