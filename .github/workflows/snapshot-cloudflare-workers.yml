name: Snapshot live Cloudflare Workers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/snapshot-cloudflare-workers.yml'

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: c2275f5f50ccabe425a5cafe68128a9a

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Fetch live Worker sources and safe settings
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/webtv-cloudflare-snapshot
          for worker in epg-proxy-gr source-huntatonisworkersdev tv-cache; do
            echo "Snapshotting $worker"
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$worker" \
              -o "/tmp/webtv-cloudflare-snapshot/$worker.raw"

            curl --fail --silent --show-error \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$worker/settings" \
              -o "/tmp/webtv-cloudflare-snapshot/$worker.settings.raw.json"
          done

          python3 <<'PY'
          import json, re
          from pathlib import Path
          from email.parser import BytesParser
          from email.policy import default

          root=Path('/tmp/webtv-cloudflare-snapshot')
          workers=['epg-proxy-gr','source-huntatonisworkersdev','tv-cache']

          def extract_script(raw: bytes):
              head=raw[:500].lower()
              if b'content-disposition:' not in head and b'content-type:' not in head:
                  return raw
              # Cloudflare module uploads can be multipart. Try MIME parsing with a synthetic header.
              first=raw.split(b'\n',1)[0]
              boundary=None
              m=re.match(br'--([^\r\n]+)', first.strip())
              if m:
                  boundary=m.group(1).decode('utf-8','ignore')
              if not boundary:
                  return raw
              msg=BytesParser(policy=default).parsebytes(
                  f'Content-Type: multipart/form-data; boundary={boundary}\r\nMIME-Version: 1.0\r\n\r\n'.encode()+raw
              )
              candidates=[]
              for part in msg.iter_parts():
                  name=part.get_param('name', header='content-disposition') or ''
                  filename=part.get_filename() or ''
                  ctype=part.get_content_type()
                  payload=part.get_payload(decode=True) or b''
                  if name=='metadata':
                      continue
                  score=0
                  if filename.endswith(('.js','.mjs','.ts')): score+=4
                  if ctype in ('application/javascript','text/javascript','application/typescript'): score+=3
                  if b'export default' in payload or b'addEventListener' in payload: score+=2
                  candidates.append((score, filename or name, payload))
              if not candidates:
                  return raw
              candidates.sort(reverse=True, key=lambda x:x[0])
              return candidates[0][2]

          for w in workers:
              raw=(root/f'{w}.raw').read_bytes()
              script=extract_script(raw)
              (root/f'{w}.js').write_bytes(script)

              try:
                  data=json.loads((root/f'{w}.settings.raw.json').read_text())
              except Exception:
                  data={}
              result=data.get('result', data) if isinstance(data,dict) else {}
              safe={
                  'worker': w,
                  'compatibility_date': result.get('compatibility_date'),
                  'compatibility_flags': result.get('compatibility_flags') or [],
                  'usage_model': result.get('usage_model'),
                  'bindings': []
              }
              for b in result.get('bindings') or []:
                  if not isinstance(b,dict): continue
                  item={'name':b.get('name'),'type':b.get('type')}
                  for k in ('namespace_id','bucket_name','database_id','database_name','service','environment','class_name','queue_name'):
                      if b.get(k) is not None: item[k]=b.get(k)
                  safe['bindings'].append(item)
              (root/f'{w}.settings.safe.json').write_text(json.dumps(safe,indent=2,ensure_ascii=False)+'\n')
              (root/f'{w}.settings.raw.json').unlink(missing_ok=True)
              (root/f'{w}.raw').unlink(missing_ok=True)
          PY

      - name: Upload snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: webtv-cloudflare-live-snapshot
          path: /tmp/webtv-cloudflare-snapshot
          retention-days: 1
          if-no-files-found: error
