name: Deploy Source Discovery Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'workers/webtv-source-discovery.js'
      - 'workers/source-discovery/**/*.js'
      - '.github/workflows/deploy-source-discovery.yml'

permissions:
  contents: read

concurrency:
  group: deploy-source-discovery
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: c2275f5f50ccabe425a5cafe68128a9a
  WORKER_NAME: webtv-source-discovery
  WORKER_URL: https://webtv-source-discovery.atonis.workers.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Validate source
        shell: bash
        run: |
          node --input-type=module --check < workers/webtv-source-discovery.js
          while IFS= read -r file; do node --check "$file"; done < <(find workers/source-discovery -type f -name '*.js' | sort)

      - name: Run discovery regression tests
        run: |
          node tests/discovery-external.test.mjs
          node tests/source-discovery-worker.test.mjs
          node tests/github-public-playlists-provider.test.mjs
          node tests/recent-web-search-provider.test.mjs
          node tests/strm-specific-discovery-provider.test.mjs

      - name: Build Wrangler config
        shell: bash
        run: |
          cat > wrangler.source-discovery.ci.toml <<'EOF'
          name = "webtv-source-discovery"
          main = "workers/webtv-source-discovery.js"
          compatibility_date = "2026-09-20"
          workers_dev = true
          preview_urls = false
          keep_vars = true
          EOF

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.source-discovery.ci.toml

      - name: Verify live Worker and all external providers
        shell: bash
        run: |
          set -u -o pipefail
          for attempt in $(seq 1 12); do
            STATUS=$(curl --fail --silent --show-error "$WORKER_URL/?verify=$GITHUB_SHA" || true)
            CURATED=$(curl --fail --silent --show-error -X POST "$WORKER_URL/discover" -H 'content-type: application/json' --data '{"provider":"curated-remote-feeds","freshness":"7d","channel":{"name":"MEGA","id":"mega","originalId":"MEGA"}}' || true)
            GITHUB=$(curl --fail --silent --show-error -X POST "$WORKER_URL/discover" -H 'content-type: application/json' --data '{"provider":"github-public-playlists","freshness":"7d","channel":{"name":"MEGA","id":"mega","originalId":"MEGA"}}' || true)
            WEB=$(curl --fail --silent --show-error -X POST "$WORKER_URL/discover" -H 'content-type: application/json' --data '{"provider":"recent-web-search","freshness":"7d","channel":{"name":"MEGA","id":"mega","originalId":"MEGA"}}' || true)
            STRM=$(curl --fail --silent --show-error -X POST "$WORKER_URL/discover" -H 'content-type: application/json' --data '{"provider":"strm-specific-discovery","freshness":"7d","channel":{"name":"ERT1","id":"ert1","originalId":"ERT1"}}' || true)
            if node -e "try{const s=JSON.parse(process.argv[1]),c=JSON.parse(process.argv[2]),g=JSON.parse(process.argv[3]),w=JSON.parse(process.argv[4]),r=JSON.parse(process.argv[5]);const githubOk=Array.isArray(g.reports?.searches)&&g.reports.searches.some(x=>x.status===200);const webOk=Array.isArray(w.reports?.searches)&&w.reports.searches.some(x=>x.status===200);const strmFeedOk=Array.isArray(r.reports?.feeds)&&r.reports.feeds.some(x=>x.status===200);const strmResolved=Array.isArray(r.reports?.resolutions)&&r.reports.resolutions.some(x=>x.resolved===true);const ok=s.service==='WebTV Source Discovery'&&s.version==='1.3'&&s.providers?.['curated-remote-feeds']===true&&s.providers?.['github-public-playlists']===true&&s.providers?.['recent-web-search']===true&&s.providers?.['strm-specific-discovery']===true&&c.provider==='curated-remote-feeds'&&Array.isArray(c.reports)&&c.reports.some(x=>x.status===200)&&g.provider==='github-public-playlists'&&g.freshnessApplied===true&&githubOk&&w.provider==='recent-web-search'&&w.freshnessApplied===true&&webOk&&r.provider==='strm-specific-discovery'&&r.freshnessApplied===false&&strmFeedOk&&strmResolved&&Array.isArray(r.candidates)&&r.candidates.length>0;if(!ok)process.exit(1);console.log(JSON.stringify({status:s,curated:{candidateCount:c.candidates?.length||0},github:{candidateCount:g.candidates?.length||0,reports:g.reports},web:{candidateCount:w.candidates?.length||0,reports:w.reports},strm:{candidateCount:r.candidates?.length||0,reports:r.reports,candidate:r.candidates?.[0]||null}},null,2));}catch{process.exit(1)}" "$STATUS" "$CURATED" "$GITHUB" "$WEB" "$STRM"; then
              echo "Source Discovery v1.3 is live; curated, GitHub, recent web, and STRM resolution all reached their public upstreams."
              exit 0
            fi
            echo "Waiting for Worker/provider availability ($attempt/12)…"
            sleep 5
          done
          echo "::error::Source Discovery v1.3 live verification failed. Check provider upstreams and BRAVE_API_KEY."
          exit 1
