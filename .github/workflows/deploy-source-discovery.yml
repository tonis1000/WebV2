name: Deploy Source Discovery Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'workers/webtv-source-discovery.js'
      - '.github/workflows/deploy-source-discovery.yml'

permissions:
  contents: read

concurrency:
  group: deploy-source-discovery
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: c2275f5f50ccabe425a5cafe68128a9a
  WORKER_NAME: webtv-source-discovery
  WORKER_URL: https://webtv-source-discovery.atonis.workers.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Validate source
        run: node --input-type=module --check < workers/webtv-source-discovery.js

      - name: Run discovery regression tests
        run: |
          node tests/discovery-external.test.mjs
          node tests/source-discovery-worker.test.mjs

      - name: Build Wrangler config
        shell: bash
        run: |
          cat > wrangler.source-discovery.ci.toml <<'EOF'
          name = "webtv-source-discovery"
          main = "workers/webtv-source-discovery.js"
          compatibility_date = "2026-09-20"
          workers_dev = true
          preview_urls = false
          keep_vars = true
          EOF

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.source-discovery.ci.toml

      - name: Verify live Worker and outbound curated feed scan
        shell: bash
        run: |
          set -u -o pipefail
          for attempt in $(seq 1 12); do
            STATUS=$(curl --fail --silent --show-error "$WORKER_URL/?verify=$GITHUB_SHA" || true)
            RESULT=$(curl --fail --silent --show-error -X POST "$WORKER_URL/discover" -H 'content-type: application/json' --data '{"provider":"curated-remote-feeds","freshness":"7d","channel":{"name":"MEGA","id":"mega","originalId":"MEGA"}}' || true)
            if node -e "try{const s=JSON.parse(process.argv[1]),r=JSON.parse(process.argv[2]);const ok=s.service==='WebTV Source Discovery'&&s.version==='1.0'&&s.providers?.['curated-remote-feeds']===true&&r.provider==='curated-remote-feeds'&&Array.isArray(r.reports)&&r.reports.length===4&&r.reports.some(x=>x.status===200)&&Array.isArray(r.candidates);if(!ok)process.exit(1);console.log(JSON.stringify({status:s,reports:r.reports,candidateCount:r.candidates.length},null,2));}catch{process.exit(1)}" "$STATUS" "$RESULT"; then
              echo "Source Discovery v1.0 is live and at least one curated external feed was fetched successfully."
              exit 0
            fi
            echo "Waiting for Worker/feed availability ($attempt/12)…"
            sleep 5
          done
          echo "::error::Source Discovery live verification failed"
          exit 1
