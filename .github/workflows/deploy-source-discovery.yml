name: Deploy Source Discovery Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'workers/webtv-source-discovery.js'
      - 'workers/webtv-source-discovery-smart.js'
      - 'workers/source-discovery/**/*.js'
      - 'src/search/curated-source-catalog.js'
      - 'src/search/family-matching.js'
      - 'src/core/channel-identity-gr.js'
      - 'src/core/source-candidate-url.js'
      - 'src/core/m3u-container.js'
      - 'src/core/strm-core.js'
      - 'src/core/enigma2-core.js'
      - 'tests/channel-identity-core.test.mjs'
      - 'tests/m3u-container-core.test.mjs'
      - 'tests/strm-core.test.mjs'
      - 'tests/enigma2-core.test.mjs'
      - 'tests/source-discovery-m3u-parity.test.mjs'
      - 'tests/candidate-url-sanitizer.test.mjs'
      - 'tests/source-discovery-enigma2-parity.test.mjs'
      - 'tests/*discovery*.test.mjs'
      - 'tests/*provider.test.mjs'
      - 'tests/curated-remote-feeds.test.mjs'
      - 'tests/search-source-addition-ergonomics.test.mjs'
      - 'tests/search-family-query.test.mjs'
      - '.github/workflows/deploy-source-discovery.yml'

permissions:
  contents: read

concurrency:
  group: deploy-source-discovery
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: c2275f5f50ccabe425a5cafe68128a9a
  WORKER_NAME: webtv-source-discovery
  WORKER_URL: https://webtv-source-discovery.atonis.workers.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Validate source
        shell: bash
        run: |
          node --input-type=module --check < workers/webtv-source-discovery.js
          node --input-type=module --check < workers/webtv-source-discovery-smart.js
          node --check src/search/curated-source-catalog.js
          node --check src/search/family-matching.js
          node --check src/core/channel-identity-gr.js
          node --check src/core/source-candidate-url.js
          node --check src/core/m3u-container.js
          node --check src/core/strm-core.js
          node --check src/core/enigma2-core.js
          while IFS= read -r file; do node --check "$file"; done < <(find workers/source-discovery -type f -name '*.js' | sort)

      - name: Run discovery regression tests
        run: |
          node tests/channel-identity-core.test.mjs
          node tests/candidate-url-sanitizer.test.mjs
          node tests/m3u-container-core.test.mjs
          node tests/strm-core.test.mjs
          node tests/enigma2-core.test.mjs
          node tests/source-discovery-m3u-parity.test.mjs
          node tests/source-discovery-enigma2-parity.test.mjs
          node tests/discovery-external.test.mjs
          node tests/source-discovery-worker.test.mjs
          node tests/source-discovery-bounded-read.test.mjs
          node tests/curated-remote-feeds.test.mjs
          node tests/search-source-addition-ergonomics.test.mjs
          node tests/search-family-query.test.mjs
          node tests/github-public-playlists-provider.test.mjs
          node tests/recent-web-search-provider.test.mjs
          node tests/strm-specific-discovery-provider.test.mjs
          node tests/source-discovery-smart-strm-parity.test.mjs
          node tests/source-discovery-smart-private-filter.test.mjs
          node tests/source-discovery-smart-iptv-org.test.mjs
          node tests/official-discovery-retirement.test.mjs

      - name: Build Wrangler config
        shell: bash
        run: |
          cat > wrangler.source-discovery.ci.toml <<'EOF'
          name = "webtv-source-discovery"
          main = "workers/webtv-source-discovery-smart.js"
          compatibility_date = "2026-09-20"
          workers_dev = true
          preview_urls = false
          keep_vars = true
          EOF

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.source-discovery.ci.toml

      - name: Verify live Worker and retained external providers
        shell: bash
        run: |
          set -u -o pipefail
          for attempt in $(seq 1 12); do
            STATUS=$(curl --fail --silent --show-error "$WORKER_URL/?verify=$GITHUB_SHA" || true)
            CURATED=$(curl --fail --silent --show-error -X POST "$WORKER_URL/discover" -H 'content-type: application/json' --data '{"provider":"curated-remote-feeds","freshness":"7d","channel":{"name":"MEGA","id":"mega","originalId":"MEGA"}}' || true)
            FOREIGN=$(curl --fail --silent --show-error -X POST "$WORKER_URL/discover" -H 'content-type: application/json' --data '{"provider":"curated-remote-feeds","freshness":"7d","channel":{"name":"CNN","id":"cnn","originalId":"CNN","tvgId":"CNN.us"}}' || true)
            HEADER_PROBE=$(curl --fail --silent --show-error -X POST "$WORKER_URL/discover" -H 'content-type: application/json' --data '{"provider":"curated-remote-feeds","freshness":"7d","channel":{"name":"2M Monde","id":"2mmonde","originalId":"2M Monde","tvgId":"2MMonde.ma@SD"}}' || true)
            GITHUB=$(curl --fail --silent --show-error -X POST "$WORKER_URL/discover" -H 'content-type: application/json' --data '{"provider":"github-public-playlists","freshness":"7d","channel":{"name":"MEGA","id":"mega","originalId":"MEGA"}}' || true)
            STRM=$(curl --fail --silent --show-error -X POST "$WORKER_URL/discover" -H 'content-type: application/json' --data '{"provider":"strm-specific-discovery","freshness":"7d","channel":{"name":"ERT1","id":"ert1","originalId":"ERT1"}}' || true)
            PAID_GUARD_CODE=$(curl --silent --show-error --output /tmp/recent-web-guard.json --write-out '%{http_code}' -X POST "$WORKER_URL/discover" -H 'content-type: application/json' --data '{"provider":"recent-web-search","freshness":"7d","channel":{"name":"MEGA","id":"mega","originalId":"MEGA"}}' || true)
            FALLBACK_EMPTY=$(curl --fail --silent --show-error -X POST "$WORKER_URL/discover" -H 'content-type: application/json' --data '{"provider":"curated-remote-feeds","freshness":"7d","channel":{"name":"__WEBV2_NO_SUCH_CHANNEL__","id":"__webv2_no_such_channel__","originalId":"__WEBV2_NO_SUCH_CHANNEL__"}}' || true)
            FALLBACK_PRIVATE=$(curl --fail --silent --show-error -X POST "$WORKER_URL/discover" -H 'content-type: application/json' --data '{"provider":"curated-remote-feeds","freshness":"7d","channel":{"name":"Západoslovenská TV (Twich)","id":"zapadoslovenska-tv-twich","originalId":"Západoslovenská TV (Twich)"}}' || true)
            if node -e "try{const s=JSON.parse(process.argv[1]),c=JSON.parse(process.argv[2]),g=JSON.parse(process.argv[3]),r=JSON.parse(process.argv[4]),e=JSON.parse(process.argv[5]),p=JSON.parse(process.argv[6]),guardCode=process.argv[7],guard=JSON.parse(require('fs').readFileSync('/tmp/recent-web-guard.json','utf8'));const githubOk=Array.isArray(g.reports?.searches)&&g.reports.searches.some(x=>x.status===200);const strmFeedOk=Array.isArray(r.reports?.feeds)&&r.reports.feeds.some(x=>x.status===200);const strmShapeOk=Array.isArray(r.reports?.feeds)&&Array.isArray(r.reports?.resolutions)&&Array.isArray(r.candidates);const foreign=JSON.parse(process.argv[8]);const headerProbe=JSON.parse(process.argv[9]);const foreignPlanOk=foreign?.planning?.strategy==='iptv-org-country'&&foreign?.planning?.countryCode==='us'&&Array.isArray(foreign.reports)&&foreign.reports.some(x=>x.feed==='iptv-org US');const structuredOk=headerProbe?.planning?.structuredIptvOrg===true&&headerProbe?.structuredIptvOrg?.status===200&&headerProbe?.structuredIptvOrg?.count>0&&Array.isArray(headerProbe.candidates)&&headerProbe.candidates.some(x=>x?.inputFormatId==='iptv-org-streams-json'&&x?.iptvOrgChannelId==='2MMonde.ma'&&x?.iptvOrgFeedId==='SD');const officialPageAbsent=!Object.prototype.hasOwnProperty.call(s.providers||{},'official-provider-lane');const officialApiAbsent=!Object.prototype.hasOwnProperty.call(s.providers||{},'official-api-resolver');const retiredBrowserAbsent=!Object.prototype.hasOwnProperty.call(s.providers||{},'browser-resolved-official');const smartFeature=Array.isArray(s.features)&&s.features.includes('curated STRM pre-resolution');const fallbackEmptyOk=e.provider==='curated-remote-feeds'&&Array.isArray(e.reports)&&Array.isArray(e.candidates);const privateCandidateAbsent=p.provider==='curated-remote-feeds'&&Array.isArray(p.reports)&&Array.isArray(p.candidates)&&p.reports.some(x=>x.feed==='Ciefp IPTV Mix'&&x.status===200)&&!p.candidates.some(x=>/^(?:https?:\/\/)?(?:127\.|10\.|192\.168\.|172\.(?:1[6-9]|2\d|3[01])\.|localhost)/i.test(String(x.sourceUrl||'')));const alivegrOk=Array.isArray(c.reports)&&c.reports.some(x=>x.feed==='AliveGR'&&x.status===200&&x.count>0);const headerCandidate=(headerProbe.candidates||[]).find(x=>x?.requiredHeaders?.Referer&&x?.requiredHeaders?.['User-Agent']);const headerOk=headerProbe?.planning?.strategy==='iptv-org-country'&&headerProbe?.planning?.countryCode==='ma'&&Boolean(headerCandidate);const paidPolicy=s.costPolicy==='free-first'&&Array.isArray(s.paidFallbackProviders)&&s.paidFallbackProviders.includes('recent-web-search');const paidGuardOk=guardCode==='409'&&guard.paidFallbackRequired===true;const ok=s.service==='WebTV Source Discovery'&&s.version==='1.14'&&paidPolicy&&paidGuardOk&&smartFeature&&s.providers?.['curated-remote-feeds']===true&&s.providers?.['github-public-playlists']===true&&s.providers?.['recent-web-search']===true&&s.providers?.['strm-specific-discovery']===true&&officialPageAbsent&&officialApiAbsent&&retiredBrowserAbsent&&c.provider==='curated-remote-feeds'&&Array.isArray(c.reports)&&c.reports.some(x=>x.status===200)&&alivegrOk&&g.provider==='github-public-playlists'&&g.freshnessApplied===true&&githubOk&&r.provider==='strm-specific-discovery'&&r.freshnessApplied===false&&strmFeedOk&&strmShapeOk&&fallbackEmptyOk&&privateCandidateAbsent&&foreignPlanOk&&structuredOk&&headerOk;if(!ok)process.exit(1);console.log(JSON.stringify({status:s,curated:{candidateCount:c.candidates?.length||0,alivegrOk,strmResolution:c.strmResolution||null},github:{candidateCount:g.candidates?.length||0},strm:{candidateCount:r.candidates?.length||0,strmShapeOk},foreign:{strategy:foreign?.planning?.strategy||'',countryCode:foreign?.planning?.countryCode||'',feedSeen:foreignPlanOk},structured:{ok:structuredOk,count:headerProbe?.structuredIptvOrg?.count||0,channel:'2MMonde.ma',feed:'SD'},headers:{strategy:headerProbe?.planning?.strategy||'',countryCode:headerProbe?.planning?.countryCode||'',requiredHeaders:headerCandidate?.requiredHeaders||{}}},null,2));}catch{process.exit(1)}" "$STATUS" "$CURATED" "$GITHUB" "$STRM" "$FALLBACK_EMPTY" "$FALLBACK_PRIVATE" "$PAID_GUARD_CODE" "$FOREIGN" "$HEADER_PROBE"; then
              echo "Source Discovery v1.14 is live with free-first cost policy; deploy verification used only free/direct providers."
              exit 0
            fi
            echo "Waiting for Worker/provider availability ($attempt/12)…"
            sleep 5
          done
          echo "::error::Source Discovery v1.14 free-first live verification failed"
          exit 1
