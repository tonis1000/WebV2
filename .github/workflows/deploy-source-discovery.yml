name: Deploy Source Discovery Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'workers/webtv-source-discovery.js'
      - 'workers/webtv-source-discovery-smart.js'
      - 'workers/source-discovery/**/*.js'
      - 'src/core/channel-identity-gr.js'
      - 'tests/channel-identity-core.test.mjs'
      - 'tests/*discovery*.test.mjs'
      - 'tests/*provider.test.mjs'
      - 'tests/curated-remote-feeds.test.mjs'
      - '.github/workflows/deploy-source-discovery.yml'

permissions:
  contents: read

concurrency:
  group: deploy-source-discovery
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: c2275f5f50ccabe425a5cafe68128a9a
  WORKER_NAME: webtv-source-discovery
  WORKER_URL: https://webtv-source-discovery.atonis.workers.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Validate source
        shell: bash
        run: |
          node --input-type=module --check < workers/webtv-source-discovery.js
          node --input-type=module --check < workers/webtv-source-discovery-smart.js
          node --check src/core/channel-identity-gr.js
          while IFS= read -r file; do node --check "$file"; done < <(find workers/source-discovery -type f -name '*.js' | sort)

      - name: Run discovery regression tests
        run: |
          node tests/channel-identity-core.test.mjs
          node tests/discovery-external.test.mjs
          node tests/source-discovery-worker.test.mjs
          node tests/curated-remote-feeds.test.mjs
          node tests/github-public-playlists-provider.test.mjs
          node tests/recent-web-search-provider.test.mjs
          node tests/strm-specific-discovery-provider.test.mjs
          node tests/official-provider-lane.test.mjs
          node tests/official-api-resolver-provider.test.mjs

      - name: Build Wrangler config
        shell: bash
        run: |
          cat > wrangler.source-discovery.ci.toml <<'EOF'
          name = "webtv-source-discovery"
          main = "workers/webtv-source-discovery-smart.js"
          compatibility_date = "2026-09-20"
          workers_dev = true
          preview_urls = false
          keep_vars = true

          [[services]]
          binding = "SOURCE_VERIFIER"
          service = "webtv-source-verifier"
          EOF

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.source-discovery.ci.toml

      - name: Verify live Worker and all external providers
        shell: bash
        run: |
          set -u -o pipefail
          for attempt in $(seq 1 12); do
            STATUS=$(curl --fail --silent --show-error "$WORKER_URL/?verify=$GITHUB_SHA" || true)
            CURATED=$(curl --fail --silent --show-error -X POST "$WORKER_URL/discover" -H 'content-type: application/json' --data '{"provider":"curated-remote-feeds","freshness":"7d","channel":{"name":"MEGA","id":"mega","originalId":"MEGA"}}' || true)
            GITHUB=$(curl --fail --silent --show-error -X POST "$WORKER_URL/discover" -H 'content-type: application/json' --data '{"provider":"github-public-playlists","freshness":"7d","channel":{"name":"MEGA","id":"mega","originalId":"MEGA"}}' || true)
            WEB=$(curl --fail --silent --show-error -X POST "$WORKER_URL/discover" -H 'content-type: application/json' --data '{"provider":"recent-web-search","freshness":"7d","channel":{"name":"MEGA","id":"mega","originalId":"MEGA"}}' || true)
            STRM=$(curl --fail --silent --show-error -X POST "$WORKER_URL/discover" -H 'content-type: application/json' --data '{"provider":"strm-specific-discovery","freshness":"7d","channel":{"name":"ERT1","id":"ert1","originalId":"ERT1"}}' || true)
            OFFICIAL=$(curl --fail --silent --show-error -X POST "$WORKER_URL/discover" -H 'content-type: application/json' --data '{"provider":"official-provider-lane","freshness":"7d","channel":{"name":"ERT1","id":"ert1","originalId":"ERT1"}}' || true)
            OFFICIAL_API=$(curl --fail --silent --show-error -X POST "$WORKER_URL/discover" -H 'content-type: application/json' --data '{"provider":"official-api-resolver","freshness":"7d","channel":{"name":"ERT1","id":"ert1","originalId":"ERT1"}}' || true)
            if node -e "try{const s=JSON.parse(process.argv[1]),c=JSON.parse(process.argv[2]),g=JSON.parse(process.argv[3]),w=JSON.parse(process.argv[4]),r=JSON.parse(process.argv[5]),o=JSON.parse(process.argv[6]),a=JSON.parse(process.argv[7]);const githubOk=Array.isArray(g.reports?.searches)&&g.reports.searches.some(x=>x.status===200);const webOk=Array.isArray(w.reports?.searches)&&w.reports.searches.some(x=>x.status===200);const strmFeedOk=Array.isArray(r.reports?.feeds)&&r.reports.feeds.some(x=>x.status===200);const strmResolved=Array.isArray(r.reports?.resolutions)&&r.reports.resolutions.some(x=>x.resolved===true);const officialPageOk=Array.isArray(o.reports?.pages)&&o.reports.pages.some(x=>x.status===200);const officialSafe=Array.isArray(o.candidates)&&o.candidates.some(x=>x.candidateKind==='official-page'&&x.trustClass==='OFFICIAL'&&x.saveEligible===false);const apiFlag=s.providers?.['official-api-resolver']===true;const retiredBrowserAbsent=!Object.prototype.hasOwnProperty.call(s.providers||{},'browser-resolved-official');const smartFeature=Array.isArray(s.features)&&s.features.includes('curated STRM pre-resolution');const safeHeadersOk=Array.isArray(a.reports?.verification?.finalResponseHeaders?.headerNames)&&typeof a.reports?.verification?.finalResponseHeaders?.hasSetCookie==='boolean'&&typeof a.reports?.verification?.finalResponseHeaders?.hasWwwAuthenticate==='boolean';const apiOk=a.provider==='official-api-resolver'&&a.recognized===true&&a.reports?.api?.status===200&&a.reports?.verification?.transport==='service-binding'&&a.reports?.verification?.serviceStatus===200&&typeof a.reports?.verification?.verified==='boolean'&&safeHeadersOk&&Array.isArray(a.candidates);const ok=s.service==='WebTV Source Discovery'&&s.version==='1.8'&&smartFeature&&s.providers?.['curated-remote-feeds']===true&&s.providers?.['github-public-playlists']===true&&s.providers?.['recent-web-search']===true&&s.providers?.['strm-specific-discovery']===true&&s.providers?.['official-provider-lane']===true&&apiFlag&&retiredBrowserAbsent&&c.provider==='curated-remote-feeds'&&Array.isArray(c.reports)&&c.reports.some(x=>x.status===200)&&g.provider==='github-public-playlists'&&g.freshnessApplied===true&&githubOk&&w.provider==='recent-web-search'&&w.freshnessApplied===true&&webOk&&r.provider==='strm-specific-discovery'&&r.freshnessApplied===false&&strmFeedOk&&strmResolved&&Array.isArray(r.candidates)&&r.candidates.length>0&&o.provider==='official-provider-lane'&&o.recognized===true&&officialPageOk&&officialSafe&&apiOk;if(!ok)process.exit(1);console.log(JSON.stringify({status:s,curated:{candidateCount:c.candidates?.length||0,strmResolution:c.strmResolution||null},github:{candidateCount:g.candidates?.length||0},web:{candidateCount:w.candidates?.length||0},strm:{candidateCount:r.candidates?.length||0},official:{candidateCount:o.candidates?.length||0},officialApi:{candidateCount:a.candidates?.length||0,apiStatus:a.reports?.api?.status,verification:a.reports?.verification}},null,2));}catch{process.exit(1)}" "$STATUS" "$CURATED" "$GITHUB" "$WEB" "$STRM" "$OFFICIAL" "$OFFICIAL_API"; then
              echo "Source Discovery v1.8 is live with retired Browser Resolver absent and official API resolver active."
              exit 0
            fi
            echo "Waiting for Worker/provider availability ($attempt/12)…"
            sleep 5
          done
          echo "::error::Source Discovery v1.8 live verification failed. Check curated upstreams, STRM resolution, verifier binding, official pages, BRAVE_API_KEY, official API resolver, and retired Browser Resolver absence."
          exit 1
