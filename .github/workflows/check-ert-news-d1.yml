name: Check ERT News in D1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-ert-news-d1.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch public My Playlist and extract ERT News
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H 'Cache-Control: no-cache' \
            'https://webtv-registry.atonis.workers.dev/api/my-playlist?check=ert-news' \
            -o /tmp/my-playlist.json

          python3 <<'PY'
          import json
          from pathlib import Path

          data=json.loads(Path('/tmp/my-playlist.json').read_text())
          channels=data.get('channels') or data.get('playlist') or data.get('items') or []
          if isinstance(channels, dict):
              channels=channels.get('channels') or []

          matches=[]
          for ch in channels:
              name=str(ch.get('name') or ch.get('title') or '')
              if 'ert news' in name.lower() or name.lower().replace(' ','') in ('ertnews','ert-news'):
                  matches.append(ch)

          out={'count':len(matches),'matches':matches}
          Path('/tmp/ert-news.json').write_text(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY

      - name: Upload filtered result
        uses: actions/upload-artifact@v4
        with:
          name: ert-news-d1-check
          path: /tmp/ert-news.json
          retention-days: 1
