name: Promote reviewed live Workers into repo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-live-workers.yml'

permissions:
  contents: write

env:
  CLOUDFLARE_ACCOUNT_ID: c2275f5f50ccabe425a5cafe68128a9a

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch current live Workers
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p workers/live-settings
          for worker in epg-proxy-gr source-huntatonisworkersdev tv-cache; do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$worker" \
              -o "/tmp/$worker.raw"
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$worker/settings" \
              -o "/tmp/$worker.settings.json"
          done

          python3 <<'PY'
          import json,re
          from pathlib import Path
          from email.parser import BytesParser
          from email.policy import default

          names=['epg-proxy-gr','source-huntatonisworkersdev','tv-cache']
          root=Path('.')

          def extract(raw):
              m=re.match(br'--([^\r\n]+)',raw.strip().split(b'\n',1)[0])
              if not m:return raw
              boundary=m.group(1).decode('utf-8','ignore')
              msg=BytesParser(policy=default).parsebytes(
                  f'Content-Type: multipart/form-data; boundary={boundary}\r\nMIME-Version: 1.0\r\n\r\n'.encode()+raw)
              cand=[]
              for part in msg.iter_parts():
                  name=part.get_param('name',header='content-disposition') or ''
                  filename=part.get_filename() or ''
                  payload=part.get_payload(decode=True) or b''
                  if name=='metadata':continue
                  score=(4 if filename.endswith(('.js','.mjs','.ts')) else 0)+(2 if b'export default' in payload or b'addEventListener' in payload else 0)
                  cand.append((score,payload))
              return max(cand,key=lambda x:x[0])[1] if cand else raw

          for w in names:
              script=extract(Path(f'/tmp/{w}.raw').read_bytes())
              text=script.decode('utf-8')
              # Refuse obvious embedded credentials before publishing to the public repo.
              bad=[
                  r'-----BEGIN [A-Z ]*PRIVATE KEY-----',
                  r'(?i)authorization\s*[:=]\s*["\']Bearer\s+[A-Za-z0-9._-]{20,}',
                  r'(?i)(api[_-]?key|secret|password|token)\s*=\s*["\'][A-Za-z0-9_\-]{24,}["\']'
              ]
              for pat in bad:
                  if re.search(pat,text):
                      raise SystemExit(f'Refusing to publish {w}: possible hard-coded credential matched {pat}')
              Path(f'workers/{w}.js').write_text(text)

              raw=json.loads(Path(f'/tmp/{w}.settings.json').read_text())
              s=raw.get('result',raw)
              safe={'worker':w,'compatibility_date':s.get('compatibility_date'),'compatibility_flags':s.get('compatibility_flags') or [],'usage_model':s.get('usage_model'),'bindings':[]}
              for b in s.get('bindings') or []:
                  item={'name':b.get('name'),'type':b.get('type')}
                  for k in ('namespace_id','bucket_name','database_id','database_name','service','environment','class_name','queue_name'):
                      if b.get(k) is not None:item[k]=b.get(k)
                  safe['bindings'].append(item)
              Path(f'workers/live-settings/{w}.json').write_text(json.dumps(safe,indent=2,ensure_ascii=False)+'\n')
          PY

          node --check workers/epg-proxy-gr.js
          node --check workers/source-huntatonisworkersdev.js
          node --check workers/tv-cache.js

      - name: Commit canonical Worker sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "webtv-cloudflare-sync"
          git config user.email "actions@users.noreply.github.com"
          git add workers/epg-proxy-gr.js workers/source-huntatonisworkersdev.js workers/tv-cache.js workers/live-settings/
          git rm .github/workflows/promote-live-workers.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Import canonical Cloudflare Worker sources"
          git push origin HEAD:main
