name: Diagnose Phase 4.3 Live Providers

on:
  push:
    branches: [diag-phase43-live]
    paths:
      - '.github/workflows/diag-phase43-live.yml'

permissions:
  contents: read

# Re-run after Brave header alignment deploy.
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WORKER_URL: https://webtv-source-discovery.atonis.workers.dev
      LEGACY_WORKER_URL: https://source-huntatonisworkersdev.atonis.workers.dev
    steps:
      - name: Probe production Source Discovery and legacy Source Hunt
        shell: bash
        run: |
          set -u -o pipefail
          echo '=== NEW SOURCE DISCOVERY STATUS ==='
          curl --silent --show-error "$WORKER_URL/" || true
          echo
          echo '=== NEW RECENT WEB ==='
          curl --silent --show-error -X POST "$WORKER_URL/discover" \
            -H 'content-type: application/json' \
            --data '{"provider":"recent-web-search","freshness":"7d","channel":{"name":"MEGA","id":"mega","originalId":"MEGA"}}' || true
          echo
          echo '=== LEGACY SOURCE HUNT ==='
          curl --silent --show-error "$LEGACY_WORKER_URL/hunt?channel=MEGA&days=7&debug=1" || true
          echo
