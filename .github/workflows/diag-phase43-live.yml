name: Diagnose Phase 4.3 Live Providers

on:
  push:
    branches: [diag-phase43-live]
    paths:
      - '.github/workflows/diag-phase43-live.yml'

permissions:
  contents: read

# Re-run after rotating both Workers from the same Brave API key clipboard.
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WORKER_URL: https://webtv-source-discovery.atonis.workers.dev
      LEGACY_WORKER_URL: https://source-huntatonisworkersdev.atonis.workers.dev
    steps:
      - name: Compare both Workers after identical Brave key rotation
        shell: bash
        run: |
          set -u -o pipefail
          echo '=== NEW RECENT WEB 30d / pm ==='
          curl --silent --show-error -X POST "$WORKER_URL/discover" \
            -H 'content-type: application/json' \
            --data '{"provider":"recent-web-search","freshness":"30d","channel":{"name":"MEGA","id":"mega","originalId":"MEGA"}}' || true
          echo
          echo '=== LEGACY SOURCE HUNT 30d / pm ==='
          curl --silent --show-error "$LEGACY_WORKER_URL/hunt?channel=MEGA&days=30&debug=1" || true
          echo
