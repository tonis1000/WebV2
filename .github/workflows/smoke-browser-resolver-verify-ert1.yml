name: Smoke Browser Resolver Verify ERT1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smoke-browser-resolver-verify-ert1.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Discover and verify ERT1 safely
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const DISCOVERY='https://webtv-source-discovery.atonis.workers.dev/discover';
          const VERIFIER='https://webtv-source-verifier.atonis.workers.dev/verify';

          const discoveryResponse=await fetch(DISCOVERY,{
            method:'POST',
            headers:{'content-type':'application/json'},
            body:JSON.stringify({
              provider:'browser-resolved-official',
              freshness:'7d',
              channel:{name:'ERT1',id:'ert1',originalId:'ERT1',tvgId:'ERT1'}
            })
          });
          if(!discoveryResponse.ok)throw new Error(`Discovery HTTP ${discoveryResponse.status}`);
          const discovery=await discoveryResponse.json();
          const candidates=(Array.isArray(discovery.candidates)?discovery.candidates:[])
            .filter(c=>c.sourceType==='dash'&&['OFFICIAL','OFFICIAL_OBSERVED'].includes(c.trustClass))
            .slice(0,4);
          if(!candidates.length)throw new Error('No ERT DASH candidate from browser discovery');

          const verifierResponse=await fetch(VERIFIER,{
            method:'POST',
            headers:{'content-type':'application/json'},
            body:JSON.stringify({candidates:candidates.map((candidate,index)=>({
              candidateId:`ert1-browser-smoke-${index}`,
              sourceType:candidate.sourceType,
              sourceUrl:candidate.sourceUrl,
              requiredHeaders:candidate.requiredHeaders||{}
            }))})
          });
          if(!verifierResponse.ok)throw new Error(`Verifier HTTP ${verifierResponse.status}`);
          const verifier=await verifierResponse.json();
          const results=Array.isArray(verifier.results)?verifier.results:[];
          const safeResults=candidates.map((candidate,index)=>{
            const result=results[index]||null;
            const host=(()=>{try{return new URL(candidate.sourceUrl).hostname}catch{return''}})();
            return{
              host,
              sourceType:candidate.sourceType,
              headerNames:Object.keys(candidate.requiredHeaders||{}),
              trustClass:candidate.trustClass,
              saveEligible:candidate.saveEligible,
              verification:result?{
                status:result.status,
                verified:result.verified,
                startupMs:result.startupMs,
                lastHttpStatus:result.lastHttpStatus,
                mediaType:result.mediaType,
                drmDetected:result.drmDetected,
                detail:result.detail
              }:null
            };
          });
          console.log(JSON.stringify({candidateCount:candidates.length,results:safeResults},null,2));
          const good=safeResults.find(item=>item.verification?.verified===true&&item.verification?.status==='VERIFIED'&&item.verification?.mediaType==='dash');
          if(!good)process.exit(4);
          NODE
