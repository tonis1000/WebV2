name: Probe ERTFlix Public Contract

on:
  pull_request:
    paths:
      - '.github/workflows/probe-ertflix-public.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Inspect public ERTFlix API strings
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 'https://live.ertflix.gr/series' -o /tmp/series.html
          curl --fail --silent --show-error --max-time 30 'https://live.ertflix.gr/details/ERT_PS057243_E0' -o /tmp/detail.html
          cat /tmp/series.html /tmp/detail.html | grep -oE '/_next/static/[^"'"'"' ]+\.js' | sort -u >/tmp/chunks.txt || true
          : >/tmp/all.js
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            curl --fail --silent --show-error --max-time 30 "https://live.ertflix.gr$path" >>/tmp/all.js || true
            printf '\n' >>/tmp/all.js
          done </tmp/chunks.txt
          echo "RAW_HTML_BYTES=$(cat /tmp/series.html /tmp/detail.html | wc -c)"
          echo "CHUNKS=$(wc -l </tmp/chunks.txt)"
          echo "BUNDLE_BYTES=$(wc -c </tmp/all.js)"
          echo "=== API PATHS ==="
          grep -oE '/api/[A-Za-z0-9_?=&%./{}$~:+-]+' /tmp/all.js | sort -u | head -n 300 || true
          echo "=== FETCH CALLS ==="
          python - <<'PY'
          import re
          s=open('/tmp/all.js',encoding='utf-8',errors='ignore').read()
          for m in re.finditer(r'fetch\(',s):
              x=s[max(0,m.start()-180):min(len(s),m.start()+500)].replace('\n',' ')
              if any(k in x.lower() for k in ('api','detail','series','episode','content','template','vod')):
                  print(x[:700])
          PY
