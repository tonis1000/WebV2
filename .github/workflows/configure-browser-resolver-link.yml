name: Configure Browser Resolver Link

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: c2275f5f50ccabe425a5cafe68128a9a
  SOURCE_WORKER_NAME: webtv-source-discovery
  BROWSER_RESOLVER_URL: https://webtv-browser-resolver.atonis.workers.dev/resolve

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Require shared resolver token
        shell: bash
        env:
          RESOLVER_SHARED_TOKEN: ${{ secrets.BROWSER_RESOLVER_SHARED_TOKEN }}
        run: |
          if [ -z "$RESOLVER_SHARED_TOKEN" ]; then
            echo "::error::Missing repository secret BROWSER_RESOLVER_SHARED_TOKEN"
            exit 1
          fi
      - name: Install Wrangler
        run: npm install --no-save --no-audit --no-fund wrangler@4
      - name: Link Source Discovery to Browser Resolver
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BROWSER_RESOLVER_TOKEN: ${{ secrets.BROWSER_RESOLVER_SHARED_TOKEN }}
        run: |
          node -e "const fs=require('fs');fs.writeFileSync('browser-link-secrets.json',JSON.stringify({BROWSER_RESOLVER_URL:process.env.BROWSER_RESOLVER_URL,BROWSER_RESOLVER_TOKEN:process.env.BROWSER_RESOLVER_TOKEN}))"
          npx wrangler secret bulk browser-link-secrets.json --name "$SOURCE_WORKER_NAME"
          rm -f browser-link-secrets.json
      - name: Verify capability is enabled
        shell: bash
        run: |
          for attempt in $(seq 1 8); do
            STATUS=$(curl --fail --silent --show-error 'https://webtv-source-discovery.atonis.workers.dev/' || true)
            if node -e "const s=JSON.parse(process.argv[1]);if(s.providers?.['browser-resolved-official']!==true)process.exit(1);console.log(JSON.stringify(s,null,2));" "$STATUS"; then
              echo "Browser Resolver capability is enabled in Source Discovery."
              exit 0
            fi
            sleep 4
          done
          echo "::error::Browser Resolver capability did not become active"
          exit 1
