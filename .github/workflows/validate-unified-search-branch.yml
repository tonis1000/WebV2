name: Validate Unified Search Branch

on:
  push:
    branches:
      - design/hunt-discovery-unified-search
    paths:
      - 'index.html'
      - 'src/search/**'
      - 'unified-search.css'
      - 'src/discovery/candidate-model.js'
      - 'src/discovery/external-discovery-client.js'
      - 'workers/webtv-source-discovery.js'
      - 'tests/search-*.test.mjs'
      - 'tests/unified-*.test.mjs'
      - 'tests/discovery-candidate-provenance.test.mjs'
      - 'tests/discovery-external-provenance.test.mjs'
      - 'tests/curated-remote-feeds.test.mjs'
      - 'tests/source-discovery-m3u-parity.test.mjs'
      - 'tests/source-discovery-enigma2-parity.test.mjs'
      - '.github/workflows/deploy-source-discovery.yml'
      - '.github/workflows/validate-unified-search-branch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unified-search:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validate shared curated source syntax
        run: |
          node --check src/search/curated-source-catalog.js
          node --input-type=module --check < workers/webtv-source-discovery.js
      - name: Run unified search intent contract
        run: node tests/search-intent.test.mjs
      - name: Run unified search group catalog contract
        run: node tests/search-group-catalog.test.mjs
      - name: Run unified search state contract
        run: node tests/search-state.test.mjs
      - name: Run unified search completion contract
        run: node tests/search-state-completion.test.mjs
      - name: Run Unified Search Now Playing state contract
        run: node tests/search-now-playing-state.test.mjs
      - name: Run unified source registry contract
        run: node tests/unified-source-registry.test.mjs
      - name: Run single-owner curated source addition ergonomics contract
        run: node tests/search-source-addition-ergonomics.test.mjs
      - name: Run curated source parser regressions
        run: |
          node tests/curated-remote-feeds.test.mjs
          node tests/source-discovery-m3u-parity.test.mjs
          node tests/source-discovery-enigma2-parity.test.mjs
      - name: Run search adapter contract
        run: node tests/search-adapter-contract.test.mjs
      - name: Run search provider adapter contract
        run: node tests/search-provider-adapters.test.mjs
      - name: Run unified search runtime lane contract
        run: node tests/search-runtime.test.mjs
      - name: Run grouped search result contract
        run: node tests/search-result-grouper.test.mjs
      - name: Run candidate provenance and capability contract
        run: node tests/discovery-candidate-provenance.test.mjs
      - name: Run external provenance normalization contract
        run: node tests/discovery-external-provenance.test.mjs
      - name: Run structured search reporter contract
        run: node tests/search-reporter.test.mjs
      - name: Run unified search verifier bridge contract
        run: node tests/search-verification.test.mjs
      - name: Run progressive search orchestrator contract
        run: node tests/search-orchestrator.test.mjs
      - name: Run progressive verifier integration contract
        run: node tests/search-orchestrator-verification.test.mjs
      - name: Run polished unified search UI contract
        run: node tests/unified-search-ui-contract.test.mjs
      - name: Run Unified Search page wiring contract
        run: node tests/unified-search-page-wiring.test.mjs
      - name: Run Unified Search legacy One-Click parity contract
        run: node tests/unified-search-oneclick-parity.test.mjs
