name: Research AliveGR ANT1 Sources

on:
  push:
    branches: [research-alivegr-ant1-sources]
    paths:
      - '.github/workflows/research-alivegr-ant1-sources.yml'

permissions:
  contents: read

env:
  VERIFIER: https://webtv-source-verifier.atonis.workers.dev

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Verify current non-DRM AliveGR ANT1-family candidates
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/payload.json <<'JSON'
          {
            "candidates": [
              {
                "candidateId":"ant1-alivegr-roku",
                "sourceType":"hls",
                "sourceUrl":"http://15.235.41.165/hls/antenna.m3u8",
                "requiredHeaders":{
                  "User-Agent":"Roku/DVP-15.6 (15.6.4.9914-CE)",
                  "X-Roku-Reserved-Dev-Id":"75ab1929b0c20717db1fd855a37a03a6a621fc3f"
                }
              },
              {
                "candidateId":"ant1-dash",
                "sourceType":"dash",
                "sourceUrl":"https://mcdn.antennaplus.gr/live/media0/Ant1/Dash/Ant1.mpd"
              },
              {
                "candidateId":"ant1-comedy-lcdn",
                "sourceType":"hls",
                "sourceUrl":"https://lcdn.antennaplus.gr/r2921141ed585493580aba05cf37a76cb/eu-central-1/6415884360001/playlist.m3u8"
              },
              {
                "candidateId":"ant1-drama-lcdn",
                "sourceType":"hls",
                "sourceUrl":"https://lcdn.antennaplus.gr/r123fc9b6eb1b493fa0ac71004f572652/eu-central-1/6415884360001/playlist.m3u8"
              }
            ]
          }
          JSON
          curl -fsS -X POST "$VERIFIER/verify" -H 'content-type: application/json' --data-binary @/tmp/payload.json | tee /tmp/results.json
          echo
          node - <<'NODE'
          const j=require('/tmp/results.json');
          for(const r of j.results||[]){
            console.log(JSON.stringify({
              candidateId:r.candidateId,
              status:r.status,
              verified:r.verified,
              http:r.lastHttpStatus,
              mediaType:r.mediaType,
              streamKind:r.streamKind,
              drmDetected:r.drmDetected,
              detail:r.detail,
              finalTarget:r.finalTarget
            }));
          }
          NODE

      - name: Probe manifests directly from runner
        shell: bash
        run: |
          set -u -o pipefail
          probe(){
            name="$1"; url="$2"; shift 2
            code=$(curl -sS -L --max-time 12 -o "/tmp/$name.body" -w '%{http_code}' "$@" "$url" || true)
            bytes=$(wc -c < "/tmp/$name.body" | tr -d ' ')
            prefix=$(head -c 120 "/tmp/$name.body" | tr '\n' ' ')
            echo "$name HTTP=$code bytes=$bytes prefix=$prefix"
          }
          probe ANT1_ROKU http://15.235.41.165/hls/antenna.m3u8 -H 'User-Agent: Roku/DVP-15.6 (15.6.4.9914-CE)' -H 'X-Roku-Reserved-Dev-Id: 75ab1929b0c20717db1fd855a37a03a6a621fc3f'
          probe ANT1_DASH https://mcdn.antennaplus.gr/live/media0/Ant1/Dash/Ant1.mpd
          probe COMEDY_LCDN https://lcdn.antennaplus.gr/r2921141ed585493580aba05cf37a76cb/eu-central-1/6415884360001/playlist.m3u8
          probe DRAMA_LCDN https://lcdn.antennaplus.gr/r123fc9b6eb1b493fa0ac71004f572652/eu-central-1/6415884360001/playlist.m3u8
          probe ANT1_LCDN_DVR https://lcdn.antennaplus.gr/r86d08d448885424196f6cd3ddc5d1489/eu-central-1/6415884360001/playlist_dvr.m3u8
          probe COMEDY_LCDN_DVR https://lcdn.antennaplus.gr/r2921141ed585493580aba05cf37a76cb/eu-central-1/6415884360001/playlist_dvr.m3u8
          probe DRAMA_LCDN_DVR https://lcdn.antennaplus.gr/r123fc9b6eb1b493fa0ac71004f572652/eu-central-1/6415884360001/playlist_dvr.m3u8
          probe ANT1_VARIANT_180 https://mcdn.antennaplus.gr/live/media0/Ant1/HLS/Ant1-avc1_800000=4249956612.m3u8
          probe ANT1_VARIANT_540 https://mcdn.antennaplus.gr/live/media0/Ant1/HLS/Ant1-avc1_1000000=3293880965.m3u8
          probe ANT1_VARIANT_720 https://mcdn.antennaplus.gr/live/media0/Ant1/HLS/Ant1-avc1_2000000=2246142959.m3u8
          probe ANT1_VARIANT_1080 https://mcdn.antennaplus.gr/live/media0/Ant1/HLS/Ant1-avc1_8000000=1141144780.m3u8
          probe ANT1_AUDIO https://mcdn.antennaplus.gr/live/media0/Ant1/HLS/Ant1-mp4a_128000_eng=2334241234.m3u8
          probe ANT1_ROKU_HTTPS https://15.235.41.165/hls/antenna.m3u8 -k -H 'User-Agent: Roku/DVP-15.6 (15.6.4.9914-CE)' -H 'X-Roku-Reserved-Dev-Id: 75ab1929b0c20717db1fd855a37a03a6a621fc3f'
