name: Append Phase 4.4 Manual

on:
  push:
    branches: [phase4-strm-discovery]
    paths:
      - '.github/workflows/append-phase44-manual.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase4-strm-discovery
      - name: Append canonical Phase 4.4 checkpoint and clean temporary files
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q '^## 25\. Source Discovery V2 Phase 4 provider #4' WEBTV_OPERATIONS.md; then
            cat PHASE44_MANUAL_APPEND.tmp >> WEBTV_OPERATIONS.md
          fi
          rm PHASE44_MANUAL_APPEND.tmp
          rm .github/workflows/append-phase44-manual.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A WEBTV_OPERATIONS.md PHASE44_MANUAL_APPEND.tmp .github/workflows/append-phase44-manual.yml
          git commit -m 'Document Phase 4.4 STRM discovery'
          git push origin HEAD:phase4-strm-discovery
