name: Append Phase 4.4 Manual

on:
  push:
    branches: [phase4-strm-discovery]
    paths:
      - '.github/workflows/append-phase44-manual.yml'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase4-strm-discovery
      - name: Append canonical Phase 4.4 checkpoint and remove this workflow
        env:
          SECTION_B64: 
      - name: Update manual
        shell: bash
        run: |
          python - <<'PY'
          import base64, os, pathlib
          path=pathlib.Path('WEBTV_OPERATIONS.md')
          text=path.read_text(encoding='utf-8')
          section=base64.b64decode(os.environ['SECTION_B64']).decode('utf-8')
          if '## 25. Source Discovery V2 Phase 4 provider #4' not in text:
              path.write_text(text.rstrip()+section+'\n',encoding='utf-8')
          PY
          rm .github/workflows/append-phase44-manual.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add WEBTV_OPERATIONS.md .github/workflows/append-phase44-manual.yml
          git commit -m 'Document Phase 4.4 STRM discovery'
          git push origin HEAD:phase4-strm-discovery
