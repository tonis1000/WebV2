name: E3b one-shot Discovery Enigma2 proof patch

on:
  push:
    branches: [phase-e3b-enigma2-normalization]
    paths:
      - '.github/workflows/e3b-discovery-live-proof-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase-e3b-enigma2-normalization
          fetch-depth: 1
      - name: Add exact ERT1 Enigma2 live proof
        shell: python
        run: |
          from pathlib import Path
          path=Path('.github/workflows/deploy-source-discovery.yml')
          text=path.read_text()
          anchor="""            CURATED=$(curl --fail --silent --show-error -X POST \"$WORKER_URL/discover\" -H 'content-type: application/json' --data '{\"provider\":\"curated-remote-feeds\",\"freshness\":\"7d\",\"channel\":{\"name\":\"MEGA\",\"id\":\"mega\",\"originalId\":\"MEGA\"}}' || true)\n"""
          addition=anchor+"""            ENIGMA=$(curl --fail --silent --show-error -X POST \"$WORKER_URL/discover\" -H 'content-type: application/json' --data '{\"provider\":\"curated-remote-feeds\",\"freshness\":\"7d\",\"channel\":{\"name\":\"ERT1\",\"id\":\"ert1\",\"originalId\":\"ERT1\"}}' || true)\n            ENIGMA_OK=0\n            if node -e \"try{const e=JSON.parse(process.argv[1]);const ok=e.provider==='curated-remote-feeds'&&Array.isArray(e.reports)&&e.reports.some(x=>x.feed==='HansSettings Greece'&&x.format==='enigma2'&&x.status===200&&x.count>0);if(!ok)process.exit(1);console.log(JSON.stringify({enigma2:e.reports.filter(x=>x.format==='enigma2')},null,2));}catch{process.exit(1)}\" \"$ENIGMA\"; then ENIGMA_OK=1; fi\n"""
          if text.count(anchor)!=1:
              raise SystemExit(f'expected one CURATED anchor, found {text.count(anchor)}')
          text=text.replace(anchor,addition)
          old='            if node -e "try{const s=JSON.parse(process.argv[1])'
          new='            if [ "$ENIGMA_OK" = 1 ] && node -e "try{const s=JSON.parse(process.argv[1])'
          if text.count(old)!=1:
              raise SystemExit(f'expected one main verification condition, found {text.count(old)}')
          text=text.replace(old,new)
          old_error='Source Discovery v1.8 live verification failed. Check curated upstreams, STRM resolution, verifier binding, official pages, BRAVE_API_KEY, official API resolver, and retired Browser Resolver absence.'
          new_error='Source Discovery v1.8 live verification failed. Check Enigma2/HansSettings, curated upstreams, STRM resolution, verifier binding, official pages, BRAVE_API_KEY, official API resolver, and retired Browser Resolver absence.'
          if text.count(old_error)!=1:
              raise SystemExit(f'expected one error message, found {text.count(old_error)}')
          path.write_text(text.replace(old_error,new_error))
      - name: Remove one-shot workflow
        run: rm .github/workflows/e3b-discovery-live-proof-patch.yml
      - name: Verify patch
        run: |
          git diff --check
          grep -n 'ENIGMA\|HansSettings Greece' .github/workflows/deploy-source-discovery.yml
          git diff -- .github/workflows/deploy-source-discovery.yml .github/workflows/e3b-discovery-live-proof-patch.yml
      - name: Commit patch and self-delete
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/deploy-source-discovery.yml .github/workflows/e3b-discovery-live-proof-patch.yml
          git commit -m 'ci: verify live Enigma2 Discovery parsing'
          git push origin HEAD:phase-e3b-enigma2-normalization
