name: E3b one-shot index cache patch

on:
  push:
    branches: [phase-e3b-enigma2-normalization]
    paths:
      - '.github/workflows/e3b-index-cache-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase-e3b-enigma2-normalization
          fetch-depth: 1
      - name: Apply exact cache-bust replacement
        shell: python
        run: |
          from pathlib import Path
          path=Path('index.html')
          text=path.read_text()
          old='<script type="module" src="./src/source-hunt-enigma2.js?v=20260929-enigma2-visible-proxy"></script>'
          new='<script type="module" src="./src/source-hunt-enigma2.js?v=20260930-enigma2-e3b"></script>'
          count=text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one old Enigma2 script tag, found {count}')
          path.write_text(text.replace(old,new))
      - name: Remove one-shot workflow
        run: rm .github/workflows/e3b-index-cache-patch.yml
      - name: Verify only intended files changed cleanly
        run: |
          git diff --check
          git diff -- index.html .github/workflows/e3b-index-cache-patch.yml
      - name: Commit patch and self-delete
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/e3b-index-cache-patch.yml
          git commit -m 'chore: cache-bust Enigma2 frontend module'
          git push origin HEAD:phase-e3b-enigma2-normalization
