name: Append Phase 5.3 Manual

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/append-phase53-manual.yml'
      - 'tmp/phase53-xtream-lifecycle-section.md'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Append Phase 5.3 operations section
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '^## 30\. Source Discovery V2 Phase 5\.3' WEBTV_OPERATIONS.md; then
            echo 'Section 30 already present; nothing to append.'
            exit 0
          fi
          cat tmp/phase53-xtream-lifecycle-section.md >> WEBTV_OPERATIONS.md
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add WEBTV_OPERATIONS.md
          git commit -m 'Document Phase 5.3 Xtream lifecycle cleanup'
          git push origin HEAD:main
