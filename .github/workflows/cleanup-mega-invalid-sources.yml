name: Cleanup MEGA invalid sources
# Rerun safety gate against Source Verifier v1.2

on:
  pull_request:
    paths:
      - '.github/workflows/cleanup-mega-invalid-sources.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-mega-invalid-sources.yml'

permissions:
  contents: read

env:
  REGISTRY_URL: https://webtv-registry.atonis.workers.dev
  VERIFIER_URL: https://webtv-source-verifier.atonis.workers.dev
  CLOUDFLARE_ACCOUNT_ID: c2275f5f50ccabe425a5cafe68128a9a
  HANS_MEGA_URL: https://streamcdng16-c98db5952cb54b358365984178fb898a.msvdn.net/live/S14373792/aGr5KG7RcZ9a/playlist.m3u8
  OLD_MEGA_URL_1: https://c98db5952cb54b358365984178fb898a.msvdn.net/live/S99841657/NU0xOarAMJ5X/playlist.m3u8
  OLD_MEGA_URL_2: https://c98db5952cb54b358365984178fb898a.msvdn.net/vod/UxsxbokJCXXL/playlist.m3u8

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Verify current MEGA state is exactly the expected pre-cleanup state
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H 'Cache-Control: no-cache' "$REGISTRY_URL/api/my-playlist?verify=$GITHUB_SHA" -o /tmp/my-playlist.json
          node <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/my-playlist.json','utf8'));
          const mega=(j.channels||[]).find(c=>c.id==='mega');
          if(!mega) throw new Error('MEGA channel not found');
          const got=(mega.sources||[]).map(s=>s.url).sort();
          const expected=[process.env.OLD_MEGA_URL_1,process.env.OLD_MEGA_URL_2].sort();
          if(JSON.stringify(got)!==JSON.stringify(expected)){
            console.error('Refusing cleanup because MEGA source set changed.');
            console.error('Current:',got);
            console.error('Expected:',expected);
            process.exit(1);
          }
          console.log('MEGA pre-cleanup source set matches exactly.');
          NODE

      - name: Verify Hans MEGA candidate is live media
        shell: bash
        run: |
          set -euo pipefail
          BODY=$(node -e "process.stdout.write(JSON.stringify({candidate:{candidateId:'mega-hans-cleanup',sourceType:'hls',sourceUrl:process.env.HANS_MEGA_URL}}))")
          curl -fsS -X POST "$VERIFIER_URL/verify" -H 'content-type: application/json' --data "$BODY" -o /tmp/hans-verifier.json
          cat /tmp/hans-verifier.json
          node <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/hans-verifier.json','utf8'));
          const r=j.results?.[0];
          if(r?.status!=='VERIFIED'||r?.verified!==true||r?.streamKind!=='live'){
            console.error('Hans MEGA candidate is not VERIFIED live media.');
            process.exit(1);
          }
          console.log('Hans MEGA candidate verified as live.');
          NODE

      - name: Resolve D1 database
        if: github.event_name == 'push'
        id: d1
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPTIONAL_D1_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          set -euo pipefail
          if [ -n "${OPTIONAL_D1_ID:-}" ]; then
            echo "database_id=$OPTIONAL_D1_ID" >> "$GITHUB_OUTPUT"
            echo "database_name=webtv-registry" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npx --yes wrangler@latest d1 list --json > /tmp/d1.json
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync('/tmp/d1.json','utf8'));
          const rows=Array.isArray(raw)?raw:(raw.result||raw.databases||[]);
          const normalized=rows.map(x=>({id:x.uuid||x.id||x.database_id,name:x.name||x.database_name||''})).filter(x=>x.id);
          let chosen=normalized.find(x=>x.name==='webtv-registry');
          if(!chosen) chosen=normalized.find(x=>/webtv.*registry|registry.*webtv/i.test(x.name));
          if(!chosen&&normalized.length===1) chosen=normalized[0];
          if(!chosen) process.exit(1);
          console.log('database_id='+chosen.id);
          console.log('database_name='+(chosen.name||'webtv-registry'));
          NODE

      - name: Build temporary Wrangler config
        if: github.event_name == 'push'
        shell: bash
        env:
          D1_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
          D1_DATABASE_NAME: ${{ steps.d1.outputs.database_name }}
        run: |
          cat > wrangler.mega-cleanup.ci.toml <<EOF
          name = "webtv-registry"
          main = "workers/webtv-registry-entry.js"
          compatibility_date = "2026-09-22"
          keep_vars = true
          [[d1_databases]]
          binding = "DB"
          database_name = "$D1_DATABASE_NAME"
          database_id = "$D1_DATABASE_ID"
          EOF

      - name: Replace MEGA sources with verified Hans live source
        if: github.event_name == 'push'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          def q(v): return "'" + v.replace("'","''") + "'"
          hans=os.environ['HANS_MEGA_URL']
          old1=os.environ['OLD_MEGA_URL_1']
          old2=os.environ['OLD_MEGA_URL_2']
          sql=f"""
          INSERT INTO channel_sources(channel_id,url,origin,priority,enabled,created_at,updated_at)
          VALUES('mega',{q(hans)},'verified-hans-enigma2',100,1,CURRENT_TIMESTAMP,CURRENT_TIMESTAMP)
          ON CONFLICT(channel_id,url) DO UPDATE SET origin=excluded.origin,priority=excluded.priority,enabled=1,updated_at=CURRENT_TIMESTAMP;
          DELETE FROM channel_sources
          WHERE channel_id='mega' AND url IN ({q(old1)},{q(old2)});
          """
          Path('/tmp/mega-cleanup.sql').write_text(sql)
          PY
          npx --yes wrangler@latest d1 execute "${{ steps.d1.outputs.database_name }}" --remote --file /tmp/mega-cleanup.sql --config wrangler.mega-cleanup.ci.toml

      - name: Verify public D1 result
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            curl -fsS -H 'Cache-Control: no-cache' "$REGISTRY_URL/api/my-playlist?verify=$GITHUB_SHA-$attempt" -o /tmp/my-playlist-after.json
            if node <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/my-playlist-after.json','utf8'));
          if(Number(j.count)!==24) process.exit(1);
          const mega=(j.channels||[]).find(c=>c.id==='mega');
          if(!mega) process.exit(1);
          const urls=(mega.sources||[]).map(s=>s.url);
          if(urls.length!==1||urls[0]!==process.env.HANS_MEGA_URL) process.exit(1);
          console.log('MEGA cleanup verified: exactly one Hans live source; playlist remains 24 channels.');
          NODE
            then exit 0; fi
            sleep 3
          done
          echo "::error::MEGA cleanup did not converge to the expected public state"
          exit 1
