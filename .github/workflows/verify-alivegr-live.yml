name: Verify AliveGR Live

on:
  push:
    branches: [verify-alivegr-live]
    paths:
      - '.github/workflows/verify-alivegr-live.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Inspect live Source Discovery
        shell: bash
        run: |
          set -euo pipefail
          URL='https://webtv-source-discovery.atonis.workers.dev'
          STATUS=$(curl --fail --silent --show-error "$URL/")
          MEGA=$(curl --fail --silent --show-error -X POST "$URL/discover" -H 'content-type: application/json' --data '{"provider":"curated-remote-feeds","freshness":"7d","channel":{"name":"MEGA","id":"mega","originalId":"MEGA"}}')
          ANT1=$(curl --fail --silent --show-error -X POST "$URL/discover" -H 'content-type: application/json' --data '{"provider":"curated-remote-feeds","freshness":"7d","channel":{"name":"ANT1","id":"ant1","originalId":"ANT1"}}')
          GITHUB=$(curl --fail --silent --show-error -X POST "$URL/discover" -H 'content-type: application/json' --data '{"provider":"github-public-playlists","freshness":"7d","channel":{"name":"MEGA","id":"mega","originalId":"MEGA"}}')
          WEB=$(curl --fail --silent --show-error -X POST "$URL/discover" -H 'content-type: application/json' --data '{"provider":"recent-web-search","freshness":"7d","channel":{"name":"MEGA","id":"mega","originalId":"MEGA"}}')
          STRM=$(curl --fail --silent --show-error -X POST "$URL/discover" -H 'content-type: application/json' --data '{"provider":"strm-specific-discovery","freshness":"7d","channel":{"name":"ERT1","id":"ert1","originalId":"ERT1"}}')
          EMPTY=$(curl --fail --silent --show-error -X POST "$URL/discover" -H 'content-type: application/json' --data '{"provider":"curated-remote-feeds","freshness":"7d","channel":{"name":"__WEBV2_NO_SUCH_CHANNEL__","id":"__webv2_no_such_channel__","originalId":"__WEBV2_NO_SUCH_CHANNEL__"}}')
          PRIVATE=$(curl --fail --silent --show-error -X POST "$URL/discover" -H 'content-type: application/json' --data '{"provider":"curated-remote-feeds","freshness":"7d","channel":{"name":"Západoslovenská TV (Twich)","id":"zapadoslovenska-tv-twich","originalId":"Západoslovenská TV (Twich)"}}')
          node - "$STATUS" "$MEGA" "$ANT1" "$GITHUB" "$WEB" "$STRM" "$EMPTY" "$PRIVATE" <<'NODE'
          const [s,m,a,g,w,r,e,p]=process.argv.slice(2).map(JSON.parse);
          const summarize=x=>({
            version:x.version,
            provider:x.provider,
            reports:(x.reports||[]).map(r=>({feed:r.feed,tier:r.tier,format:r.format,status:r.status,count:r.count,error:r.error||''})),
            candidates:(x.candidates||[]).map(c=>({
              channelName:c.channelName,
              sourceOrigin:c.sourceOrigin,
              sourceType:c.sourceType,
              sourceUrl:c.sourceUrl,
              requiredHeaders:c.requiredHeaders||{},
              inputFormatId:c.inputFormatId||'',
              verificationDetail:c.verificationDetail||''
            }))
          });
          console.log('STATUS',JSON.stringify(s));
          console.log('MEGA',JSON.stringify(summarize(m),null,2));
          console.log('ANT1',JSON.stringify(summarize(a),null,2));
          const checks={
            githubOk:Array.isArray(g.reports?.searches)&&g.reports.searches.some(x=>x.status===200),
            webOk:Array.isArray(w.reports?.searches)&&w.reports.searches.some(x=>x.status===200),
            gistSearchOk:Array.isArray(w.reports?.searches)&&w.reports.searches.some(x=>x.kind==='github-gists'&&x.status===200),
            gistReportShape:Array.isArray(w.reports?.gists),
            strmFeedOk:Array.isArray(r.reports?.feeds)&&r.reports.feeds.some(x=>x.status===200),
            strmResolved:Array.isArray(r.reports?.resolutions)&&r.reports.resolutions.some(x=>x.resolved===true),
            fallbackEmptyOk:e.provider==='curated-remote-feeds'&&Array.isArray(e.reports)&&Array.isArray(e.candidates),
            privateCandidateAbsent:p.provider==='curated-remote-feeds'&&Array.isArray(p.reports)&&Array.isArray(p.candidates)&&p.reports.some(x=>x.feed==='Ciefp IPTV Mix'&&x.status===200)&&!p.candidates.some(x=>/^(?:https?:\/\/)?(?:127\.|10\.|192\.168\.|172\.(?:1[6-9]|2\d|3[01])\.|localhost)/i.test(String(x.sourceUrl||''))),
            alivegrOk:Array.isArray(m.reports)&&m.reports.some(x=>x.feed==='AliveGR'&&x.status===200&&x.count>0)
          };
          console.log('CHECKS',JSON.stringify(checks,null,2));
          console.log('GITHUB_REPORTS',JSON.stringify(g.reports||[],null,2));
          console.log('WEB_REPORTS',JSON.stringify(w.reports||{},null,2));
          console.log('STRM_REPORTS',JSON.stringify(r.reports||{},null,2));
          console.log('EMPTY',JSON.stringify({reports:e.reports,candidates:e.candidates},null,2));
          console.log('PRIVATE',JSON.stringify({reports:p.reports,candidates:p.candidates},null,2));
          NODE
