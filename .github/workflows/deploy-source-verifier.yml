name: Deploy Source Verifier Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/core/source-format-registry.js'
      - 'src/core/utils.js'
      - 'workers/webtv-source-verifier.js'
      - 'tests/source-format-registry.test.mjs'
      - 'tests/discovery-verifier.test.mjs'
      - 'tests/source-verifier-worker.test.mjs'
      - 'tests/fixtures/source-verifier-working.m3u8'
      - 'tests/fixtures/source-verifier-vod.m3u8'
      - '.github/workflows/deploy-source-verifier.yml'

permissions:
  contents: read

concurrency:
  group: deploy-source-verifier
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: c2275f5f50ccabe425a5cafe68128a9a
  WORKER_NAME: webtv-source-verifier
  WORKER_URL: https://webtv-source-verifier.atonis.workers.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Validate source
        shell: bash
        run: |
          node --check src/core/source-format-registry.js
          node --check src/core/utils.js
          node --input-type=module --check < workers/webtv-source-verifier.js

      - name: Run verifier regression tests
        run: |
          node tests/source-format-registry.test.mjs
          node tests/discovery-verifier.test.mjs
          node tests/source-verifier-worker.test.mjs

      - name: Build Wrangler config
        shell: bash
        run: |
          cat > wrangler.source-verifier.ci.toml <<'EOF'
          name = "webtv-source-verifier"
          main = "workers/webtv-source-verifier.js"
          compatibility_date = "2026-09-20"
          workers_dev = true
          preview_urls = false
          keep_vars = true
          EOF

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.source-verifier.ci.toml

      - name: Verify live Worker status and controlled probes
        shell: bash
        run: |
          set -u -o pipefail
          GOOD_URL="https://raw.githubusercontent.com/tonis1000/WebV2/$GITHUB_SHA/tests/fixtures/source-verifier-working.m3u8"
          DEAD_URL="https://raw.githubusercontent.com/tonis1000/WebV2/$GITHUB_SHA/tests/fixtures/source-verifier-dead-does-not-exist.m3u8"
          VOD_URL="https://raw.githubusercontent.com/tonis1000/WebV2/$GITHUB_SHA/tests/fixtures/source-verifier-vod.m3u8"

          for attempt in $(seq 1 12); do
            rm -f /tmp/verifier-status.json
            if curl --fail --silent --show-error "$WORKER_URL/?verify=$GITHUB_SHA" -o /tmp/verifier-status.json \
              && node -e "const fs=require('fs');try{const j=JSON.parse(fs.readFileSync('/tmp/verifier-status.json','utf8'));process.exit(j.service==='WebTV Source Verifier'&&j.version==='1.1'&&j.timeoutMs===6000&&j.maxConcurrency===2?0:1)}catch{process.exit(1)}"; then

              GOOD=$(curl --fail --silent --show-error -X POST "$WORKER_URL/verify" -H 'content-type: application/json' --data "{\"candidate\":{\"candidateId\":\"good\",\"sourceType\":\"hls\",\"sourceUrl\":\"$GOOD_URL\"}}" || true)
              DEAD=$(curl --fail --silent --show-error -X POST "$WORKER_URL/verify" -H 'content-type: application/json' --data "{\"candidate\":{\"candidateId\":\"dead\",\"sourceType\":\"hls\",\"sourceUrl\":\"$DEAD_URL\"}}" || true)
              VOD=$(curl --fail --silent --show-error -X POST "$WORKER_URL/verify" -H 'content-type: application/json' --data "{\"candidate\":{\"candidateId\":\"vod\",\"sourceType\":\"hls\",\"sourceUrl\":\"$VOD_URL\"}}" || true)
              HEADER_STATUS=$(curl --silent --show-error --output /tmp/verifier-header-aware.m3u8 --write-out '%{http_code}'                 -H 'User-Agent: Roku/DVP-14.6'                 -H 'X-Roku-Reserved-Dev-Id: device-123'                 "$WORKER_URL/fixture/header-aware.m3u8?verify=$GITHUB_SHA" || true)

              if node -e "try{const good=JSON.parse(process.argv[1]),dead=JSON.parse(process.argv[2]),vod=JSON.parse(process.argv[3]);if(good.results?.[0]?.status!=='VERIFIED'||good.results?.[0]?.streamKind!=='live'||dead.results?.[0]?.status!=='HTTP 404'||vod.results?.[0]?.status!=='VERIFIED'||vod.results?.[0]?.streamKind!=='vod')process.exit(1);}catch{process.exit(1)}" "$GOOD" "$DEAD" "$VOD"                 && [ "$HEADER_STATUS" = "200" ]                 && grep -q '#EXTM3U' /tmp/verifier-header-aware.m3u8; then
                echo "Source Verifier v1.1 is live; controlled live/VOD/dead probes and direct header-aware fixture passed."
                exit 0
              fi
            fi

            echo "Waiting for Worker/fixture propagation ($attempt/12)…"
            sleep 5
          done

          echo "::error::Source Verifier live verification failed"
          cat /tmp/verifier-status.json 2>/dev/null || true
          exit 1
