name: Deploy Source Verifier Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'workers/webtv-source-verifier.js'
      - '.github/workflows/deploy-source-verifier.yml'

permissions:
  contents: read

concurrency:
  group: deploy-source-verifier
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: c2275f5f50ccabe425a5cafe68128a9a
  WORKER_NAME: webtv-source-verifier
  WORKER_URL: https://webtv-source-verifier.atonis.workers.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Validate source
        run: node --input-type=module --check < workers/webtv-source-verifier.js

      - name: Run verifier regression tests
        run: |
          node tests/discovery-verifier.test.mjs
          node tests/source-verifier-worker.test.mjs

      - name: Build Wrangler config
        shell: bash
        run: |
          cat > wrangler.source-verifier.ci.toml <<'EOF'
          name = "webtv-source-verifier"
          main = "workers/webtv-source-verifier.js"
          compatibility_date = "2026-09-20"
          workers_dev = true
          preview_urls = false
          keep_vars = true
          EOF

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.source-verifier.ci.toml

      - name: Verify live Worker status and controlled probes
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            curl --fail --silent --show-error "$WORKER_URL/?verify=$GITHUB_SHA" -o /tmp/verifier-status.json || true
            if node -e "const fs=require('fs');try{const j=JSON.parse(fs.readFileSync('/tmp/verifier-status.json','utf8'));process.exit(j.service==='WebTV Source Verifier'&&j.version==='1.0'&&j.timeoutMs===6000&&j.maxConcurrency===2?0:1)}catch{process.exit(1)}"; then
              GOOD=$(curl --silent --show-error -X POST "$WORKER_URL/verify" -H 'content-type: application/json' --data "{\"candidate\":{\"candidateId\":\"good\",\"sourceType\":\"hls\",\"sourceUrl\":\"$WORKER_URL/fixture/working.m3u8\"}}")
              DEAD=$(curl --silent --show-error -X POST "$WORKER_URL/verify" -H 'content-type: application/json' --data "{\"candidate\":{\"candidateId\":\"dead\",\"sourceType\":\"hls\",\"sourceUrl\":\"$WORKER_URL/fixture/dead\"}}")
              node -e "const good=JSON.parse(process.argv[1]),dead=JSON.parse(process.argv[2]);if(good.results?.[0]?.status!=='VERIFIED'||dead.results?.[0]?.status!=='HTTP 404')process.exit(1);console.log(JSON.stringify({good:good.results[0],dead:dead.results[0]},null,2));" "$GOOD" "$DEAD"
              echo "Source Verifier v1.0 is live and controlled good/dead probes passed."
              exit 0
            fi
            echo "Waiting for Cloudflare propagation ($attempt/12)…"
            sleep 5
          done
          echo "::error::Source Verifier live verification failed"
          cat /tmp/verifier-status.json 2>/dev/null || true
          exit 1
