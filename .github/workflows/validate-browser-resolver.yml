name: Validate Browser Resolver

on:
  pull_request:
    paths:
      - 'browser-resolver/**'
      - '.github/workflows/validate-browser-resolver.yml'
  push:
    branches: [main]
    paths:
      - 'browser-resolver/**'
      - '.github/workflows/validate-browser-resolver.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: browser-resolver
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install pinned Browser Run client
        run: npm install --no-audit --no-fund
      - name: Syntax check
        run: node --check src/index.js
      - name: Contract tests
        run: node test.mjs
