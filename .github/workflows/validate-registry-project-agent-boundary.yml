name: Validate Registry Project Agent Boundary

on:
  pull_request:
    paths:
      - 'workers/webtv-registry-entry.js'
      - 'workers/webtv-registry.js'
      - 'workers/custom-playlist-routes.js'
      - 'tests/project-agent-put-boundary.test.mjs'
      - '.github/workflows/validate-registry-project-agent-boundary.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run project-agent PUT boundary regression
        run: node tests/project-agent-put-boundary.test.mjs
