name: Diagnose ANT1 and MEGA playback

on:
  push:
    branches: [diagnose-ant1-mega-playback]
    paths:
      - '.github/workflows/diagnose-ant1-mega-playback.yml'

permissions:
  contents: read

env:
  VERIFIER: https://webtv-source-verifier.atonis.workers.dev
  TV_CACHE: https://tv-cache.atonis.workers.dev
  ANT1: https://mcdn.antennaplus.gr/live/media0/Ant1/HLS/Ant1.m3u8
  COMEDY: https://mcdn.antennaplus.gr/live/media0/Comedy/HLS/Comedy.m3u8
  DRAMA: https://mcdn.antennaplus.gr/live/media0/Drama/HLS/Drama.m3u8
  ANT1_BACKUP: https://cdn1.smart-tv-data.com/live/ant1/playlist.m3u8
  MEGA_DASH: https://spark3.smart-tv-data.com/megaHD/megaHD/manifest.mpd

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Probe ANT1 family origin with header variants
        shell: bash
        run: |
          set -u -o pipefail
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154 Safari/537.36'
          probe() {
            label="$1"; url="$2"; shift 2
            code=$(curl -L -sS --max-time 12 -o "/tmp/$label.body" -w '%{http_code}' "$@" "$url" || true)
            ctype=$(curl -L -sS --max-time 12 -o /dev/null -D - "$@" "$url" 2>/dev/null | awk 'BEGIN{IGNORECASE=1}/^content-type:/{sub(/\r$/,"",$0); print substr($0,index($0,":")+2); exit}')
            bytes=$(wc -c < "/tmp/$label.body" | tr -d ' ')
            prefix=$(head -c 100 "/tmp/$label.body" | tr '\n' ' ')
            echo "$label HTTP=$code bytes=$bytes ctype=$ctype prefix=$prefix"
          }
          for pair in "ANT1:$ANT1" "COMEDY:$COMEDY" "DRAMA:$DRAMA"; do
            name="${pair%%:*}"; url="${pair#*:}"
            probe "${name}_PLAIN" "$url"
            probe "${name}_UA" "$url" -H "User-Agent: $UA"
            probe "${name}_TVREF" "$url" -H "User-Agent: $UA" -H "Referer: https://tv.antenna.gr/live" -H "Origin: https://tv.antenna.gr"
            probe "${name}_WWWREF" "$url" -H "User-Agent: $UA" -H "Referer: https://www.antenna.gr/" -H "Origin: https://www.antenna.gr"
            probe "${name}_PLUSREF" "$url" -H "User-Agent: $UA" -H "Referer: https://www.antennaplus.gr/" -H "Origin: https://www.antennaplus.gr"
          done
          probe "ANT1_BACKUP_PLAIN" "$ANT1_BACKUP"
          probe "ANT1_BACKUP_TVREF" "$ANT1_BACKUP" -H "User-Agent: $UA" -H "Referer: https://tv.antenna.gr/live" -H "Origin: https://tv.antenna.gr"

      - name: Probe current WebV2 header-aware worker route
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const {execFileSync}=require('child_process');
          const sources={
            ANT1:process.env.ANT1,
            COMEDY:process.env.COMEDY,
            DRAMA:process.env.DRAMA,
          };
          const headers={
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154 Safari/537.36',
            Referer:'https://tv.antenna.gr/live',
            Origin:'https://tv.antenna.gr',
          };
          const h=Buffer.from(JSON.stringify(headers),'utf8').toString('base64url');
          for(const [name,url] of Object.entries(sources)){
            const worker=process.env.TV_CACHE+'/?h='+h+'&url='+encodeURIComponent(url);
            let out='';
            try{
              out=execFileSync('curl',['-sS','-L','--max-time','15','-o','/tmp/'+name+'.worker.body','-w','%{http_code}',worker],{encoding:'utf8'}).trim();
            }catch(e){out=String(e.stdout||'').trim()||'curl-error';}
            const fs=require('fs');
            const body=fs.existsSync('/tmp/'+name+'.worker.body')?fs.readFileSync('/tmp/'+name+'.worker.body','utf8'):'';
            console.log(name+'_WORKER_HEADERS HTTP='+out+' bytes='+Buffer.byteLength(body)+' prefix='+JSON.stringify(body.slice(0,120)));
          }
          NODE

      - name: Verify candidates with Source Verifier
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const items=[
            {candidateId:'ant1-plain',sourceType:'hls',sourceUrl:process.env.ANT1},
            {candidateId:'ant1-tvref',sourceType:'hls',sourceUrl:process.env.ANT1,requiredHeaders:{'User-Agent':'Mozilla/5.0','Referer':'https://tv.antenna.gr/live','Origin':'https://tv.antenna.gr'}},
            {candidateId:'comedy-tvref',sourceType:'hls',sourceUrl:process.env.COMEDY,requiredHeaders:{'User-Agent':'Mozilla/5.0','Referer':'https://tv.antenna.gr/live','Origin':'https://tv.antenna.gr'}},
            {candidateId:'drama-tvref',sourceType:'hls',sourceUrl:process.env.DRAMA,requiredHeaders:{'User-Agent':'Mozilla/5.0','Referer':'https://tv.antenna.gr/live','Origin':'https://tv.antenna.gr'}},
          ];
          require('fs').writeFileSync('/tmp/verify-ant1.json',JSON.stringify({candidates:items}));
          NODE
          curl -fsS -X POST "$VERIFIER/verify" -H 'content-type: application/json' --data-binary @/tmp/verify-ant1.json | tee /tmp/verify-ant1.out
          echo
          node <<'NODE'
          require('fs').writeFileSync('/tmp/verify-dash.json',JSON.stringify({candidate:{candidateId:'mega-dash',sourceType:'dash',sourceUrl:process.env.MEGA_DASH}}));
          NODE
          curl -fsS -X POST "$VERIFIER/verify" -H 'content-type: application/json' --data-binary @/tmp/verify-dash.json | tee /tmp/verify-dash.out
