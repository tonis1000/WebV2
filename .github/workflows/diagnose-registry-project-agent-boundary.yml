name: Diagnose Registry Project Agent Boundary

on:
  pull_request:
    paths:
      - '.github/workflows/diagnose-registry-project-agent-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Capture live boundary statuses
        shell: bash
        run: |
          set -u
          REGISTRY_URL='https://webtv-registry.atonis.workers.dev'
          SHA='9588e191fd354b42d20ae87ab16d3a2989041df4'
          session_status=$(curl --silent --show-error --output /tmp/session.out --write-out '%{http_code}' -H 'Cache-Control: no-cache' "$REGISTRY_URL/api/project-agent/session?verify=$SHA" || true)
          read_status=$(curl --silent --show-error --output /tmp/read.out --write-out '%{http_code}' -H 'Cache-Control: no-cache' "$REGISTRY_URL/api/project-agent/checkpoints/WEBV2_CURRENT.md?verify=$SHA" || true)
          write_status=$(curl --silent --show-error --output /tmp/write.out --write-out '%{http_code}' -X PUT -H 'Cache-Control: no-cache' -H 'content-type: application/json' --data '{"content":"# unauthorized diagnostic probe\n"}' "$REGISTRY_URL/api/project-agent/checkpoints/WEBV2_CURRENT.md?verify=$SHA" || true)
          start_status=$(curl --silent --show-error --output /tmp/start.out --write-out '%{http_code}' -H 'Cache-Control: no-cache' "$REGISTRY_URL/api/project-agent/pair/start?verify=$SHA" || true)
          {
            echo "session_status=$session_status"
            echo "read_status=$read_status"
            echo "write_status=$write_status"
            echo "start_status=$start_status"
            echo '--- session body ---'; head -c 1000 /tmp/session.out 2>/dev/null || true; echo
            echo '--- read body ---'; head -c 1000 /tmp/read.out 2>/dev/null || true; echo
            echo '--- write body ---'; head -c 1000 /tmp/write.out 2>/dev/null || true; echo
            echo '--- start body ---'; head -c 2000 /tmp/start.out 2>/dev/null || true; echo
          } | tee /tmp/registry-boundary-diagnostic.txt
      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: registry-project-agent-boundary-diagnostic
          path: /tmp/registry-boundary-diagnostic.txt
          retention-days: 1
