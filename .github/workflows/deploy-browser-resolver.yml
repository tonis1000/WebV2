name: Deploy Browser Resolver

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'browser-resolver/**'
      - '.github/workflows/deploy-browser-resolver.yml'

permissions:
  contents: read

concurrency:
  group: deploy-browser-resolver
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: c2275f5f50ccabe425a5cafe68128a9a
  WORKER_URL: https://webtv-browser-resolver.atonis.workers.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Require shared resolver token
        shell: bash
        env:
          RESOLVER_SHARED_TOKEN: ${{ secrets.BROWSER_RESOLVER_SHARED_TOKEN }}
        run: |
          if [ -z "$RESOLVER_SHARED_TOKEN" ]; then
            echo "::error::Missing repository secret BROWSER_RESOLVER_SHARED_TOKEN"
            exit 1
          fi
      - name: Install resolver dependencies
        working-directory: browser-resolver
        run: npm install --no-audit --no-fund
      - name: Run resolver contract tests
        working-directory: browser-resolver
        run: node test.mjs
      - name: Deploy Browser Run Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: browser-resolver
          command: deploy
          secrets: |
            RESOLVER_SHARED_TOKEN
        env:
          RESOLVER_SHARED_TOKEN: ${{ secrets.BROWSER_RESOLVER_SHARED_TOKEN }}
      - name: Verify live status
        shell: bash
        run: |
          for attempt in $(seq 1 12); do
            STATUS=$(curl --fail --silent --show-error "$WORKER_URL/" || true)
            if node -e "try{const s=JSON.parse(process.argv[1]);if(s.service!=='WebTV Browser Resolver'||s.version!=='1.0'||s.ready!==true)process.exit(1);console.log(JSON.stringify(s,null,2));}catch{process.exit(1)}" "$STATUS"; then
              echo "Browser Resolver is live and ready."
              exit 0
            fi
            echo "Waiting for Browser Resolver propagation ($attempt/12)…"
            sleep 5
          done
          echo "::error::Browser Resolver did not become ready"
          exit 1
