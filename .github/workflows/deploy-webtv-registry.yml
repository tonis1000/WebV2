# WebTV Registry CI/CD · D1-primary verified 2026-09-22
name: Deploy WebTV Registry Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-webtv-registry
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: c2275f5f50ccabe425a5cafe68128a9a
  REGISTRY_WORKER_NAME: webtv-registry
  REGISTRY_URL: https://webtv-registry.atonis.workers.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Cloudflare token
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not configured as a GitHub Actions secret"
            exit 1
          fi

      - name: Resolve existing D1 database
        id: d1
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPTIONAL_D1_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          set -euo pipefail

          if [ -n "${OPTIONAL_D1_ID:-}" ]; then
            echo "database_id=$OPTIONAL_D1_ID" >> "$GITHUB_OUTPUT"
            echo "database_name=webtv-registry" >> "$GITHUB_OUTPUT"
            echo "Using CLOUDFLARE_D1_DATABASE_ID override."
            exit 0
          fi

          npx --yes wrangler@latest d1 list --json > /tmp/d1.json

          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('fs');
          const raw = JSON.parse(fs.readFileSync('/tmp/d1.json', 'utf8'));
          const rows = Array.isArray(raw) ? raw : (raw.result || raw.databases || []);
          const normalized = rows.map(x => ({
            id: x.uuid || x.id || x.database_id,
            name: x.name || x.database_name || ''
          })).filter(x => x.id);

          let chosen = normalized.find(x => x.name === 'webtv-registry');
          if (!chosen) chosen = normalized.find(x => /webtv.*registry|registry.*webtv/i.test(x.name));
          if (!chosen && normalized.length === 1) chosen = normalized[0];

          if (!chosen) {
            console.error('Could not identify the WebTV D1 database automatically. Available D1 databases:');
            for (const row of normalized) console.error(`- ${row.name} (${row.id})`);
            console.error('Set GitHub secret CLOUDFLARE_D1_DATABASE_ID once to select it explicitly.');
            process.exit(1);
          }

          console.error(`Resolved D1: ${chosen.name} (${chosen.id})`);
          console.log(`database_id=${chosen.id}`);
          console.log(`database_name=${chosen.name || 'webtv-registry'}`);
          NODE

      - name: Build temporary Wrangler config
        shell: bash
        env:
          D1_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
          D1_DATABASE_NAME: ${{ steps.d1.outputs.database_name }}
        run: |
          set -euo pipefail
          cat > wrangler.registry.ci.toml <<EOF
          name = "$REGISTRY_WORKER_NAME"
          main = "workers/webtv-registry-entry.js"
          compatibility_date = "2026-09-22"
          workers_dev = true
          preview_urls = false
          keep_vars = true

          [vars]
          PIN_AUTH_DISABLED = "1"

          [secrets]
          required = ["ADMIN_TOKEN", "ADMIN_PIN"]

          [[d1_databases]]
          binding = "DB"
          database_name = "$D1_DATABASE_NAME"
          database_id = "$D1_DATABASE_ID"
          EOF

      - name: Deploy Registry Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.registry.ci.toml --keep-vars

      - name: Sync GitHub project checkpoints to D1
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          names = ('WEBV2_CURRENT.md', 'SOURCE_DISCOVERY_ARCHITECTURE.md', 'WEBTV_OPERATIONS.md', 'WEBV2_SOURCE_HUNT_HANDOFF.md')
          def quote(value):
              return "'" + value.replace("'", "''") + "'"
          sql = [
              'DROP TABLE IF EXISTS project_agent_pairings;',
              'DROP TABLE IF EXISTS project_agent_sessions;',
              'CREATE TABLE IF NOT EXISTS project_checkpoints (name TEXT PRIMARY KEY, content TEXT NOT NULL, byte_length INTEGER NOT NULL, sha256 TEXT NOT NULL, updated_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP);',
              'CREATE TABLE IF NOT EXISTS project_checkpoint_history (id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT NOT NULL, content TEXT NOT NULL, byte_length INTEGER NOT NULL, sha256 TEXT NOT NULL, checkpoint_updated_at TEXT NOT NULL, archived_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP);',
          ]
          for name in names:
              path = Path(name)
              if not path.exists():
                  continue
              data = path.read_bytes()
              content = data.decode('utf-8')
              new_sha = hashlib.sha256(data).hexdigest()
              sql.append(f'INSERT INTO project_checkpoint_history(name,content,byte_length,sha256,checkpoint_updated_at,archived_at) SELECT name,content,byte_length,sha256,updated_at,CURRENT_TIMESTAMP FROM project_checkpoints WHERE name={quote(name)} AND sha256<>{quote(new_sha)};')
              sql.append(f'INSERT INTO project_checkpoints(name, content, byte_length, sha256) VALUES ({quote(name)}, {quote(" ")}, {len(data)}, {quote(new_sha)}) ON CONFLICT(name) DO UPDATE SET content=excluded.content, byte_length=excluded.byte_length, sha256=excluded.sha256, updated_at=CURRENT_TIMESTAMP;')
              sql.append(f'UPDATE project_checkpoints SET content={quote("")} WHERE name={quote(name)};')
              for offset in range(0, len(content), 2000):
                  sql.append(f'UPDATE project_checkpoints SET content=content || {quote(content[offset:offset+2000])} WHERE name={quote(name)};')
          Path('/tmp/webtv-checkpoints.sql').write_text('\n'.join(sql) + '\n')
          Path('/tmp/webtv-checkpoint-count').write_text(str(sum(Path(name).exists() for name in names)))
          PY
          npx --yes wrangler@latest d1 execute "${{ steps.d1.outputs.database_name }}" --remote --file /tmp/webtv-checkpoints.sql --config wrangler.registry.ci.toml
          npx --yes wrangler@latest d1 execute "${{ steps.d1.outputs.database_name }}" --remote --command 'SELECT name, byte_length, sha256 FROM project_checkpoints ORDER BY name' --json --config wrangler.registry.ci.toml > /tmp/webtv-checkpoints-verify.json
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          raw = json.loads(Path('/tmp/webtv-checkpoints-verify.json').read_text())
          rows = raw[0]['results'] if isinstance(raw, list) else raw['results']
          saved = {row['name']: row for row in rows}
          for name in ('WEBV2_CURRENT.md', 'SOURCE_DISCOVERY_ARCHITECTURE.md', 'WEBTV_OPERATIONS.md', 'WEBV2_SOURCE_HUNT_HANDOFF.md'):
              path = Path(name)
              if path.exists():
                  data = path.read_bytes()
                  row = saved[name]
                  assert row['byte_length'] == len(data) and row['sha256'] == hashlib.sha256(data).hexdigest(), name
          print('D1 checkpoint hashes verified:', len(saved))
          PY
          echo "Preserved $(cat /tmp/webtv-checkpoint-count) checkpoint files in D1."

      - name: Verify live Registry and primary My Playlist
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              -H 'Cache-Control: no-cache' \
              "$REGISTRY_URL/api/status?verify=${GITHUB_SHA}-${attempt}" \
              -o /tmp/webtv-registry-status.json; then
              cat /tmp/webtv-registry-status.json
              if node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/webtv-registry-status.json','utf8'));process.exit(j.version==='1.5'&&j.primaryPlaylist==='d1'&&Number(j.sessionDays)===180&&j.pinAuth===false&&j.pinAuthDisabled===true?0:1)"; then
                curl --fail --silent --show-error \
                  -H 'Cache-Control: no-cache' \
                  "$REGISTRY_URL/api/my-playlist?verify=${GITHUB_SHA}-${attempt}" \
                  -o /tmp/webtv-my-playlist.json
                if node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/webtv-my-playlist.json','utf8'));if(!Array.isArray(j.channels)||j.channels.length<13){console.error('Expected migrated D1 My Playlist, got '+(j.channels?.length??0)+' channels');process.exit(1)};console.log('Verified Registry v1.5 · D1 primary · '+j.channels.length+' My Playlist channels · temporary PIN bypass active')"; then
                  exit 0
                fi
              fi
            fi
            echo "Waiting for Cloudflare propagation · attempt $attempt/30"
            sleep 3
          done
          echo '::error::Registry did not expose v1.5 / D1-primary My Playlist / temporary PIN bypass after 90 seconds'
          exit 1

      - name: Verify temporary PIN bypass
        shell: bash
        run: |
          set -euo pipefail
          list_status=$(curl --silent --show-error --output /tmp/webtv-checkpoint-list-unauth.json --write-out '%{http_code}' \
            -H 'Cache-Control: no-cache' \
            "$REGISTRY_URL/api/project-checkpoints?verify=$GITHUB_SHA" || true)
          get_status=$(curl --silent --show-error --output /tmp/webtv-checkpoint-get-unauth.md --write-out '%{http_code}' \
            -H 'Cache-Control: no-cache' \
            "$REGISTRY_URL/api/project-checkpoints/WEBV2_CURRENT.md?verify=$GITHUB_SHA" || true)
          if [ "$list_status" != 200 ] || [ "$get_status" != 200 ]; then
            echo "::error::Temporary PIN bypass failed · list=$list_status get=$get_status"
            exit 1
          fi
          grep -q 'WEBV2_CURRENT.md' /tmp/webtv-checkpoint-list-unauth.json
          grep -q 'WEBV2 CURRENT STATE' /tmp/webtv-checkpoint-get-unauth.md

          maintenance_status=$(curl --silent --show-error --output /tmp/webtv-maintenance-session.json --write-out '%{http_code}' \
            -X POST \
            -H 'Cache-Control: no-cache' \
            "$REGISTRY_URL/api/session/maintenance?verify=$GITHUB_SHA" || true)
          if [ "$maintenance_status" != 200 ]; then
            echo "::error::Maintenance session mint failed · status=$maintenance_status"
            cat /tmp/webtv-maintenance-session.json 2>/dev/null || true
            exit 1
          fi
          maintenance_token=$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/webtv-maintenance-session.json','utf8'));if(!j.ok||!j.maintenance||!j.token)process.exit(1);process.stdout.write(j.token)")
          session_status=$(curl --silent --show-error --output /tmp/webtv-maintenance-session-validate.json --write-out '%{http_code}' \
            -H 'Cache-Control: no-cache' \
            -H "authorization: Bearer $maintenance_token" \
            "$REGISTRY_URL/api/session?verify=$GITHUB_SHA" || true)
          if [ "$session_status" != 200 ]; then
            echo "::error::Maintenance session validation failed · status=$session_status"
            cat /tmp/webtv-maintenance-session-validate.json 2>/dev/null || true
            exit 1
          fi
          echo 'Verified temporary PIN bypass and scoped maintenance-session handoff.'

      - name: Record verified deployment status
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          def quote(value):
              return "'" + value.replace("'", "''") + "'"
          message = os.environ.get('COMMIT_MESSAGE', '').splitlines()[0][:250]
          sha = os.environ['GITHUB_SHA']
          Path('/tmp/webtv-deploy-status.sql').write_text(
              'CREATE TABLE IF NOT EXISTS project_deploy_status (id INTEGER PRIMARY KEY CHECK(id=1), commit_sha TEXT NOT NULL, commit_message TEXT NOT NULL, deployed_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP);\n'
              + f'INSERT INTO project_deploy_status(id, commit_sha, commit_message) VALUES (1, {quote(sha)}, {quote(message)}) ON CONFLICT(id) DO UPDATE SET commit_sha=excluded.commit_sha, commit_message=excluded.commit_message, deployed_at=CURRENT_TIMESTAMP;\n'
          )
          PY
          npx --yes wrangler@latest d1 execute "${{ steps.d1.outputs.database_name }}" --remote --file /tmp/webtv-deploy-status.sql --config wrangler.registry.ci.toml
          curl --fail --silent --show-error "$REGISTRY_URL/api/project-status" -o /tmp/webtv-deployed-status.json
          node -e "const j=require('/tmp/webtv-deployed-status.json');if(j.commitSha!==process.env.GITHUB_SHA)process.exit(1);console.log('Verified public project status at commit '+j.commitSha)"
