# WebTV Registry CI/CD · D1-primary verified 2026-09-22
name: Deploy WebTV Registry Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-webtv-registry
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: c2275f5f50ccabe425a5cafe68128a9a
  REGISTRY_WORKER_NAME: webtv-registry
  REGISTRY_URL: https://webtv-registry.atonis.workers.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Cloudflare token
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not configured as a GitHub Actions secret"
            exit 1
          fi

      - name: Resolve existing D1 database
        id: d1
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPTIONAL_D1_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          set -euo pipefail

          if [ -n "${OPTIONAL_D1_ID:-}" ]; then
            echo "database_id=$OPTIONAL_D1_ID" >> "$GITHUB_OUTPUT"
            echo "database_name=webtv-registry" >> "$GITHUB_OUTPUT"
            echo "Using CLOUDFLARE_D1_DATABASE_ID override."
            exit 0
          fi

          npx --yes wrangler@latest d1 list --json > /tmp/d1.json

          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('fs');
          const raw = JSON.parse(fs.readFileSync('/tmp/d1.json', 'utf8'));
          const rows = Array.isArray(raw) ? raw : (raw.result || raw.databases || []);
          const normalized = rows.map(x => ({
            id: x.uuid || x.id || x.database_id,
            name: x.name || x.database_name || ''
          })).filter(x => x.id);

          let chosen = normalized.find(x => x.name === 'webtv-registry');
          if (!chosen) chosen = normalized.find(x => /webtv.*registry|registry.*webtv/i.test(x.name));
          if (!chosen && normalized.length === 1) chosen = normalized[0];

          if (!chosen) {
            console.error('Could not identify the WebTV D1 database automatically. Available D1 databases:');
            for (const row of normalized) console.error(`- ${row.name} (${row.id})`);
            console.error('Set GitHub secret CLOUDFLARE_D1_DATABASE_ID once to select it explicitly.');
            process.exit(1);
          }

          console.error(`Resolved D1: ${chosen.name} (${chosen.id})`);
          console.log(`database_id=${chosen.id}`);
          console.log(`database_name=${chosen.name || 'webtv-registry'}`);
          NODE

      - name: Build temporary Wrangler config
        shell: bash
        env:
          D1_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
          D1_DATABASE_NAME: ${{ steps.d1.outputs.database_name }}
        run: |
          set -euo pipefail
          cat > wrangler.registry.ci.toml <<EOF
          name = "$REGISTRY_WORKER_NAME"
          main = "workers/webtv-registry-entry.js"
          compatibility_date = "2026-09-22"
          workers_dev = true
          preview_urls = false
          keep_vars = true

          [vars]
          PIN_AUTH_DISABLED = "0"

          [secrets]
          required = ["ADMIN_TOKEN", "ADMIN_PIN"]

          [[d1_databases]]
          binding = "DB"
          database_name = "$D1_DATABASE_NAME"
          database_id = "$D1_DATABASE_ID"
          EOF

      - name: Deploy Registry Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.registry.ci.toml --keep-vars

      - name: Retire D1 Project Brain tables
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@latest d1 execute "${{ steps.d1.outputs.database_name }}" --remote \
            --command 'DROP TABLE IF EXISTS project_checkpoint_history; DROP TABLE IF EXISTS project_checkpoints; DROP TABLE IF EXISTS project_agent_pairings; DROP TABLE IF EXISTS project_agent_sessions;' \
            --config wrangler.registry.ci.toml
          echo 'Retired D1 Project Brain/checkpoint tables.'

      - name: Verify live Registry and primary My Playlist
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              -H 'Cache-Control: no-cache' \
              "$REGISTRY_URL/api/status?verify=${GITHUB_SHA}-${attempt}" \
              -o /tmp/webtv-registry-status.json; then
              cat /tmp/webtv-registry-status.json
              if node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/webtv-registry-status.json','utf8'));process.exit(j.version==='1.5'&&j.primaryPlaylist==='d1'&&Number(j.sessionDays)===180&&j.pinAuth===true&&!('pinAuthDisabled' in j)?0:1)"; then
                curl --fail --silent --show-error \
                  -H 'Cache-Control: no-cache' \
                  "$REGISTRY_URL/api/my-playlist?verify=${GITHUB_SHA}-${attempt}" \
                  -o /tmp/webtv-my-playlist.json
                if node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/webtv-my-playlist.json','utf8'));if(!Array.isArray(j.channels)||j.channels.length<13){console.error('Expected migrated D1 My Playlist, got '+(j.channels?.length??0)+' channels');process.exit(1)};console.log('Verified Registry v1.5 · D1 primary · '+j.channels.length+' My Playlist channels · PIN auth enabled')"; then
                  exit 0
                fi
              fi
            fi
            echo "Waiting for Cloudflare propagation · attempt $attempt/30"
            sleep 3
          done
          echo '::error::Registry did not expose v1.5 / D1-primary My Playlist / temporary PIN bypass after 90 seconds'
          exit 1

      - name: Verify Registry admin boundary
        shell: bash
        run: |
          set -euo pipefail
          maintenance_status=$(curl --silent --show-error --output /tmp/webtv-maintenance-session.json --write-out '%{http_code}' \
            -X POST \
            -H 'Cache-Control: no-cache' \
            "$REGISTRY_URL/api/session/maintenance?verify=$GITHUB_SHA" || true)
          retired_status=$(curl --silent --show-error --output /tmp/webtv-retired-project-checkpoint.json --write-out '%{http_code}' \
            -H 'Cache-Control: no-cache' \
            "$REGISTRY_URL/api/project-checkpoints?verify=$GITHUB_SHA" || true)
          if [ "$maintenance_status" != 403 ] || [ "$retired_status" != 404 ]; then
            echo "::error::Registry boundary failed · maintenance=$maintenance_status retiredCheckpointRoute=$retired_status"
            exit 1
          fi
          echo 'Verified Registry admin boundary · maintenance mint disabled · Project Brain checkpoint API retired.'

      - name: Record verified deployment status
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          def quote(value):
              return "'" + value.replace("'", "''") + "'"
          message = os.environ.get('COMMIT_MESSAGE', '').splitlines()[0][:250]
          sha = os.environ['GITHUB_SHA']
          Path('/tmp/webtv-deploy-status.sql').write_text(
              'CREATE TABLE IF NOT EXISTS project_deploy_status (id INTEGER PRIMARY KEY CHECK(id=1), commit_sha TEXT NOT NULL, commit_message TEXT NOT NULL, deployed_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP);\n'
              + f'INSERT INTO project_deploy_status(id, commit_sha, commit_message) VALUES (1, {quote(sha)}, {quote(message)}) ON CONFLICT(id) DO UPDATE SET commit_sha=excluded.commit_sha, commit_message=excluded.commit_message, deployed_at=CURRENT_TIMESTAMP;\n'
          )
          PY
          npx --yes wrangler@latest d1 execute "${{ steps.d1.outputs.database_name }}" --remote --file /tmp/webtv-deploy-status.sql --config wrangler.registry.ci.toml
          curl --fail --silent --show-error "$REGISTRY_URL/api/project-status" -o /tmp/webtv-deployed-status.json
          node -e "const j=require('/tmp/webtv-deployed-status.json');if(j.commitSha!==process.env.GITHUB_SHA)process.exit(1);console.log('Verified public project status at commit '+j.commitSha)"
