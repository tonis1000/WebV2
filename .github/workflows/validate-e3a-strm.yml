name: Validate Phase E3a STRM

on:
  pull_request:
    paths:
      - 'src/core/strm-core.js'
      - 'src/core/strm-resolver.js'
      - 'workers/source-discovery/strm-specific-discovery.js'
      - 'workers/source-huntatonisworkersdev.js'
      - 'tests/strm-*.test.mjs'
      - 'tests/source-*-strm-parity.test.mjs'
      - '.github/workflows/validate-e3a-strm.yml'

permissions:
  contents: read

jobs:
  strm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Run shared STRM core contract
        run: node tests/strm-core.test.mjs
      - name: Run browser STRM resolver parity
        run: node tests/strm-resolver-parity.test.mjs
      - name: Run Discovery STRM provider parity
        run: node tests/strm-specific-discovery-provider.test.mjs
      - name: Run Source Hunt STRM parity
        run: node tests/source-hunt-strm-parity.test.mjs
      - name: Run permanent STRM workflow contract
        run: node tests/strm-workflow-contract.test.mjs
