name: Migrate GitHub Playlist to D1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-github-playlist-to-d1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: c2275f5f50ccabe425a5cafe68128a9a

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Build safe upsert migration from data/channels.m3u
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('data/channels.m3u','utf8');
          const lines = text.split(/\r?\n/);
          const channels = [];
          const byId = new Map();
          let current = null;
          const attr = (line,name) => {
            const m = line.match(new RegExp(`${name}="([^"]*)"`,'i'));
            return m ? m[1] : '';
          };
          const norm = v => String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9α-ω]+/gi,'-').replace(/^-+|-+$/g,'').slice(0,160);
          for (const raw of lines) {
            const line = raw.trim();
            if (line.startsWith('#EXTINF:')) {
              const name = (line.split(',').slice(1).join(',') || attr(line,'tvg-name') || 'Channel').trim();
              const tvgId = attr(line,'tvg-id') || name;
              const id = norm(tvgId || name);
              let ch = byId.get(id);
              if (!ch) {
                ch = {id, tvgId, name, logo:attr(line,'tvg-logo'), groupName:attr(line,'group-title')||'Other', urls:[]};
                byId.set(id,ch); channels.push(ch);
              } else {
                if (!ch.logo) ch.logo = attr(line,'tvg-logo');
                if ((!ch.groupName || ch.groupName==='Other') && attr(line,'group-title')) ch.groupName=attr(line,'group-title');
              }
              current = ch;
            } else if (/^https?:\/\//i.test(line) && current) {
              if (!current.urls.includes(line)) current.urls.push(line);
            }
          }
          const q = v => `'${String(v??'').replace(/'/g,"''")}'`;
          const sql = [];
          channels.forEach((c,position) => {
            sql.push(`INSERT INTO channels(id,name,tvg_id,logo,group_name,enabled,created_at,updated_at) VALUES(${q(c.id)},${q(c.name)},${q(c.tvgId)},${q(c.logo)},${q(c.groupName)},1,CURRENT_TIMESTAMP,CURRENT_TIMESTAMP) ON CONFLICT(id) DO UPDATE SET name=excluded.name,tvg_id=excluded.tvg_id,logo=CASE WHEN excluded.logo<>'' THEN excluded.logo ELSE channels.logo END,group_name=excluded.group_name,enabled=1,updated_at=CURRENT_TIMESTAMP;`);
            sql.push(`INSERT INTO my_playlist(channel_id,position,added_at) VALUES(${q(c.id)},${position},CURRENT_TIMESTAMP) ON CONFLICT(channel_id) DO UPDATE SET position=excluded.position;`);
            c.urls.forEach((url,i) => sql.push(`INSERT INTO channel_sources(channel_id,url,origin,priority,enabled,created_at,updated_at) VALUES(${q(c.id)},${q(url)},'github-seed',${100+i},1,CURRENT_TIMESTAMP,CURRENT_TIMESTAMP) ON CONFLICT(channel_id,url) DO UPDATE SET enabled=1,updated_at=CURRENT_TIMESTAMP;`));
          });
          fs.writeFileSync('/tmp/migrate.sql',sql.join('\n')+'\n');
          console.log(`Prepared ${channels.length} channels for idempotent D1 upsert`);
          NODE

      - name: Apply migration to production D1
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@latest d1 execute webtv-registry --remote --file=/tmp/migrate.sql

      - name: Verify public My Playlist
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -H 'Cache-Control: no-cache' 'https://webtv-registry.atonis.workers.dev/api/my-playlist?migration=github-seed' -o /tmp/my.json
          node <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/my.json','utf8'));
          const names=(j.channels||[]).map(x=>x.name);
          console.log(`D1 My Playlist: ${j.count} channels`);
          console.log(names.join(' | '));
          const required=['ERT1','ERT2','ERT3','ERT News','ANT1','Alpha TV','SKAI','Open TV','MEGA','MEGA News','Star TV','Action 24','Kontra'];
          const missing=required.filter(x=>!names.includes(x));
          if(missing.length){console.error('Missing after migration:',missing.join(', '));process.exit(1);}
          const ert=(j.channels||[]).find(x=>x.name==='ERT News');
          if(!ert || (ert.sources||[]).length < 2){console.error('ERT News existing cloud sources were not preserved');process.exit(1);}
          console.log(`ERT News preserved sources: ${(ert.sources||[]).length}`);
          NODE
