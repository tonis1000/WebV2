name: Deploy EPG Proxy Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'workers/epg-proxy-gr.js'
      - '.github/workflows/deploy-epg-proxy-gr.yml'

permissions:
  contents: read

concurrency:
  group: deploy-epg-proxy-gr
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: c2275f5f50ccabe425a5cafe68128a9a
  WORKER_NAME: epg-proxy-gr
  WORKER_URL: https://epg-proxy-gr.atonis.workers.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Validate source
        run: node --check workers/epg-proxy-gr.js

      - name: Build Wrangler config
        shell: bash
        run: |
          cat > wrangler.epg.ci.toml <<'EOF'
          name = "epg-proxy-gr"
          main = "workers/epg-proxy-gr.js"
          compatibility_date = "2025-12-25"
          workers_dev = true
          preview_urls = false
          keep_vars = true
          EOF

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.epg.ci.toml

      - name: Verify live XMLTV feed
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 8); do
            rm -f /tmp/epg.xml
            if curl --fail --silent --show-error --max-time 45 \
              -H 'Cache-Control: no-cache' \
              "$WORKER_URL/epg.xml?verify=${GITHUB_SHA}-${attempt}" \
              -o /tmp/epg.xml; then
              if grep -q '<tv' /tmp/epg.xml \
                && grep -q '<channel' /tmp/epg.xml \
                && grep -q '<programme' /tmp/epg.xml; then
                channels=$(grep -o '<channel\b' /tmp/epg.xml | wc -l | tr -d ' ')
                programmes=$(grep -o '<programme\b' /tmp/epg.xml | wc -l | tr -d ' ')
                bytes=$(wc -c < /tmp/epg.xml | tr -d ' ')
                echo "Verified live XMLTV feed · channels=$channels programmes=$programmes bytes=$bytes"
                exit 0
              fi
              echo "EPG response was reachable but not valid XMLTV · attempt $attempt/8"
            else
              echo "Waiting for EPG feed/Cloudflare propagation · attempt $attempt/8"
            fi
            sleep 5
          done
          echo "::error::EPG proxy did not return a valid /epg.xml feed with <tv>, <channel>, and <programme>"
          exit 1
