name: Deploy EPG Proxy Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'workers/epg-proxy-gr.js'
      - '.github/workflows/deploy-epg-proxy-gr.yml'

permissions:
  contents: read

concurrency:
  group: deploy-epg-proxy-gr
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: c2275f5f50ccabe425a5cafe68128a9a
  WORKER_NAME: epg-proxy-gr
  WORKER_URL: https://epg-proxy-gr.atonis.workers.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Validate source
        run: node --check workers/epg-proxy-gr.js

      - name: Run multi-source EPG regression
        run: node tests/epg-multisource-worker.test.mjs

      - name: Build Wrangler config
        shell: bash
        run: |
          cat > wrangler.epg.ci.toml <<'EOF'
          name = "epg-proxy-gr"
          main = "workers/epg-proxy-gr.js"
          compatibility_date = "2025-12-25"
          workers_dev = true
          preview_urls = false
          keep_vars = true
          EOF

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.epg.ci.toml

      - name: Verify live XMLTV feed and status
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 8); do
            rm -f /tmp/epg.xml /tmp/epg-status.json
            feed_ok=0
            status_ok=0

            if curl --fail --silent --show-error --max-time 45 \
              -H 'Cache-Control: no-cache' \
              "$WORKER_URL/epg.xml?channels=ant1,alpha,ert1&verify=${GITHUB_SHA}-${attempt}" \
              -o /tmp/epg.xml; then
              if grep -q '<tv' /tmp/epg.xml \
                && grep -q '<channel' /tmp/epg.xml \
                && grep -q '<programme' /tmp/epg.xml; then
                feed_ok=1
              fi
            fi

            if curl --fail --silent --show-error --max-time 45 \
              -H 'Cache-Control: no-cache' \
              "$WORKER_URL/status?channels=ant1,alpha,ert1&verify=${GITHUB_SHA}-${attempt}" \
              -o /tmp/epg-status.json; then
              if node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/epg-status.json','utf8'));process.exit(j.ok===true&&j.valid===true&&j.service==='WebTV EPG Proxy'&&j.version==='multi-v5'&&j.source==='multi'&&Array.isArray(j.sourcesConfigured)&&j.sourcesConfigured.length>=5&&Array.isArray(j.sourceResults)&&j.sourceResults.some(s=>s.id==='digea'&&s.ok===true)&&Number(j.channels)>0&&Number(j.programmes)>0&&Number(j.bytes)>0?0:1)"; then
                status_ok=1
              fi
            fi

            if [ "$feed_ok" = 1 ] && [ "$status_ok" = 1 ]; then
              channels=$(grep -o '<channel\b' /tmp/epg.xml | wc -l | tr -d ' ')
              programmes=$(grep -o '<programme\b' /tmp/epg.xml | wc -l | tr -d ' ')
              bytes=$(wc -c < /tmp/epg.xml | tr -d ' ')
              cat /tmp/epg-status.json
              echo "Verified live XMLTV feed + status · channels=$channels programmes=$programmes bytes=$bytes"
              exit 0
            fi

            echo "Waiting for EPG feed/status propagation · attempt $attempt/8 · feed=$feed_ok status=$status_ok"
            sleep 5
          done
          echo "::error::EPG proxy did not return both valid /epg.xml and /status responses"
          exit 1

      - name: Verify compact viewer EPG payload
        shell: bash
        run: |
          set -euo pipefail
          channels='ert1,ert2,ert3,ertnews,ant1,alpha,skai,mega,open,meganews,star,action24,kontra,tv100,barazatvhdgreekhits,barazatvlaika,madtv,madworld,paniktv,realmusictv,ertsports1,ertsports2,ertsports3,ertsports4'
          curl --fail --silent --show-error --max-time 45 \
            -H 'Cache-Control: no-cache' \
            "$WORKER_URL/now-next.json?channels=$channels&compact=${GITHUB_SHA}" \
            -o /tmp/epg-now-next.json
          node - /tmp/epg-now-next.json <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const ok=j.service==='WebTV EPG Proxy'&&j.version==='multi-v5'&&Array.isArray(j.channels)&&j.channels.length>0&&
            Number(j.programmes)>0&&Number(j.programmes)<=j.channels.length*4&&
            j.channels.every(row=>Array.isArray(row.next)&&row.next.length<=3);
          console.log(JSON.stringify({channels:j.channels.length,programmes:j.programmes,sourcesUsed:j.sourcesUsed}));
          process.exit(ok?0:1);
          NODE
          bytes=$(wc -c < /tmp/epg-now-next.json | tr -d ' ')
          echo "Verified compact viewer EPG · bytes=$bytes"

      - name: Verify live full sidebar EPG scope
        shell: bash
        run: |
          set -euo pipefail
          channels='ert1,ert2,ert3,ertnews,ant1,alpha,skai,mega,open,meganews,star,action24,kontra,tv100,barazatvhdgreekhits,barazatvlaika,madtv,madworld,paniktv,realmusictv,ertsports1,ertsports2,ertsports3,ertsports4'
          curl --fail --silent --show-error --max-time 60 \
            -H 'Cache-Control: no-cache' \
            "$WORKER_URL/epg.xml?channels=$channels&fullscope=${GITHUB_SHA}" \
            -o /tmp/epg-full-scope.xml
          grep -q '<tv' /tmp/epg-full-scope.xml
          grep -q '<programme' /tmp/epg-full-scope.xml
          programmes=$(grep -o '<programme\b' /tmp/epg-full-scope.xml | wc -l | tr -d ' ')
          bytes=$(wc -c < /tmp/epg-full-scope.xml | tr -d ' ')
          echo "Verified full sidebar EPG scope · programmes=$programmes bytes=$bytes"

      - name: Verify live EPG source matrix
        shell: bash
        run: |
          set -u
          failures=0
          check_source() {
            label="$1"
            channels="$2"
            source_id="$3"
            status_file="/tmp/epg-matrix-${source_id}.json"
            if ! curl --fail --silent --show-error --max-time 60 \
              -H 'Cache-Control: no-cache' \
              "$WORKER_URL/status?channels=${channels}&matrix=${GITHUB_SHA}-${source_id}" \
              -o "$status_file"; then
              echo "::error::$label request failed"
              failures=$((failures+1))
              return
            fi
            if node - "$status_file" "$source_id" <<'NODE'
          const fs=require('fs');
          const [file,sourceId]=process.argv.slice(2);
          const j=JSON.parse(fs.readFileSync(file,'utf8'));
          const ok=j.ok===true&&j.valid===true&&Number(j.channels)>0&&Number(j.programmes)>0&&
            Array.isArray(j.sourceResults)&&j.sourceResults.some(s=>s.id===sourceId&&s.ok===true&&Number(s.programmes)>0);
          console.log(JSON.stringify({requested:j.requested,channels:j.channels,programmes:j.programmes,sourcesUsed:j.sourcesUsed,sourceResults:j.sourceResults,warnings:j.warnings||[]}));
          process.exit(ok?0:1);
          NODE
            then
              echo "Verified $label via $source_id"
            else
              echo "::error::$label did not verify via $source_id"
              failures=$((failures+1))
            fi
          }

          check_source "Digea private channels" "ant1,alpha,ert1" "digea"
          check_source "COSMOTE SPORT" "cosmotesport1" "cosmote"
          check_source "Nova Sports via COSMOTE guide" "novasports1" "cosmote"
          check_source "Nova Cinema" "novacinema1" "greektv"
          check_source "German Das Erste" "DasErste.de" "epgshare-de"
          if [ "$failures" -ne 0 ]; then
            echo "::error::EPG source matrix failures=$failures"
            exit 1
          fi
