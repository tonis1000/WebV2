name: Smoke Browser Resolver ERT1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smoke-browser-resolver-ert1.yml'

permissions:
  contents: read

env:
  BROWSER_URL: https://webtv-browser-resolver.atonis.workers.dev/resolve
  DISCOVERY_URL: https://webtv-source-discovery.atonis.workers.dev/discover

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve ERT1 directly through Browser Resolver
        shell: bash
        env:
          RESOLVER_TOKEN: ${{ secrets.BROWSER_RESOLVER_SHARED_TOKEN }}
        run: |
          set -euo pipefail
          BODY='{"url":"https://live.ertflix.gr/","channel":{"name":"ERT1","id":"ert1","originalId":"ERT1","tvgId":"ERT1"},"capture":{"extensions":["m3u8","mpd","mp4","webm"],"includeRequestHeaders":true,"timeoutMs":12000}}'
          HTTP=$(curl --silent --show-error -o direct.json -w '%{http_code}' -X POST "$BROWSER_URL" \
            -H 'content-type: application/json' \
            -H "authorization: Bearer $RESOLVER_TOKEN" \
            --data "$BODY")
          echo "Direct resolver HTTP $HTTP"
          node - <<'NODE'
          const fs=require('fs');
          let body={}; try{body=JSON.parse(fs.readFileSync('direct.json','utf8'))}catch{}
          const safe={service:body.service,version:body.version,error:body.error||'',observations:(body.observations||[]).map(o=>({type:o.resourceType,host:(()=>{try{return new URL(o.url).hostname}catch{return''}})(),headerNames:Object.keys(o.headers||{})}))};
          console.log(JSON.stringify(safe,null,2));
          NODE
          test "$HTTP" = "200"

      - name: Resolve ERT1 through Source Discovery lane
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE=$(curl --fail --silent --show-error -X POST "$DISCOVERY_URL" \
            -H 'content-type: application/json' \
            --data '{"provider":"browser-resolved-official","freshness":"7d","channel":{"name":"ERT1","id":"ert1","originalId":"ERT1","tvgId":"ERT1"}}')
          node - <<'NODE' "$RESPONSE"
          const body=JSON.parse(process.argv[2]);
          const safe={
            provider:body.provider,
            recognized:body.recognized,
            available:body.available,
            reports:body.reports?.pages||[],
            candidates:(body.candidates||[]).map(c=>({
              sourceType:c.sourceType,
              host:(()=>{try{return new URL(c.sourceUrl).hostname}catch{return''}})(),
              headerNames:Object.keys(c.requiredHeaders||{}),
              trustClass:c.trustClass,
              saveEligible:c.saveEligible,
              origin:c.sourceOrigin
            }))
          };
          console.log(JSON.stringify(safe,null,2));
          if(body.provider!=='browser-resolved-official') process.exit(1);
          if(body.recognized!==true || body.available!==true) process.exit(2);
          if(!Array.isArray(body.reports?.pages) || body.reports.pages.length===0) process.exit(3);
          if(!Array.isArray(body.candidates) || body.candidates.length===0) process.exit(4);
          if(!body.candidates.some(c=>['hls','dash','video'].includes(c.sourceType))) process.exit(5);
          NODE
