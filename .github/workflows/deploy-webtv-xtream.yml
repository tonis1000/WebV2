name: Deploy WebTV Xtream Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'workers/webtv-xtream.js'
      - 'workers/webtv-xtream-router.js'
      - 'workers/xtream-preview-routes.js'
      - '.github/workflows/deploy-webtv-xtream.yml'

permissions:
  contents: read

concurrency:
  group: deploy-webtv-xtream
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: c2275f5f50ccabe425a5cafe68128a9a
  XTREAM_WORKER_NAME: webtv-xtream
  XTREAM_URL: https://webtv-xtream.atonis.workers.dev
  REGISTRY_URL: https://webtv-registry.atonis.workers.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Worker syntax
        shell: bash
        run: |
          node --input-type=module --check < workers/webtv-xtream.js
          node --check workers/xtream-preview-routes.js
          node --check workers/webtv-xtream-router.js

      - name: Validate deployment secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          XTREAM_ENCRYPTION_KEY: ${{ secrets.XTREAM_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not configured as a GitHub Actions secret"
            exit 1
          fi
          if [ "${#XTREAM_ENCRYPTION_KEY}" -lt 24 ]; then
            echo "::error::XTREAM_ENCRYPTION_KEY must be configured as a GitHub Actions secret with at least 24 characters"
            exit 1
          fi

      - name: Resolve existing D1 database
        id: d1
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPTIONAL_D1_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          set -euo pipefail
          if [ -n "${OPTIONAL_D1_ID:-}" ]; then
            echo "database_id=$OPTIONAL_D1_ID" >> "$GITHUB_OUTPUT"
            echo "database_name=webtv-registry" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npx --yes wrangler@latest d1 list --json > /tmp/d1.json
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('fs');
          const raw = JSON.parse(fs.readFileSync('/tmp/d1.json', 'utf8'));
          const rows = Array.isArray(raw) ? raw : (raw.result || raw.databases || []);
          const normalized = rows.map(x => ({ id: x.uuid || x.id || x.database_id, name: x.name || x.database_name || '' })).filter(x => x.id);
          let chosen = normalized.find(x => x.name === 'webtv-registry');
          if (!chosen) chosen = normalized.find(x => /webtv.*registry|registry.*webtv/i.test(x.name));
          if (!chosen && normalized.length === 1) chosen = normalized[0];
          if (!chosen) {
            console.error('Could not identify the WebTV D1 database. Set CLOUDFLARE_D1_DATABASE_ID.');
            process.exit(1);
          }
          console.log(`database_id=${chosen.id}`);
          console.log(`database_name=${chosen.name || 'webtv-registry'}`);
          NODE

      - name: Build temporary Wrangler config
        shell: bash
        env:
          D1_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
          D1_DATABASE_NAME: ${{ steps.d1.outputs.database_name }}
        run: |
          set -euo pipefail
          cat > wrangler.xtream.ci.toml <<EOF
          name = "$XTREAM_WORKER_NAME"
          main = "workers/webtv-xtream-router.js"
          compatibility_date = "2026-09-25"
          compatibility_flags = ["global_fetch_strictly_public"]
          workers_dev = true
          preview_urls = false
          keep_vars = true

          [vars]
          REGISTRY_URL = "$REGISTRY_URL"

          [[services]]
          binding = "REGISTRY"
          service = "webtv-registry"

          [[d1_databases]]
          binding = "DB"
          database_name = "$D1_DATABASE_NAME"
          database_id = "$D1_DATABASE_ID"
          EOF

      - name: Deploy Xtream Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.xtream.ci.toml --keep-vars

      - name: Install Xtream encryption secret
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          XTREAM_ENCRYPTION_KEY: ${{ secrets.XTREAM_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$XTREAM_ENCRYPTION_KEY" | npx --yes wrangler@latest secret put XTREAM_ENCRYPTION_KEY --config wrangler.xtream.ci.toml

      - name: Verify live Xtream Worker
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            status_ok=0
            preview_options=0
            preview_auth=0
            cleanup_auth=0
            if curl --fail --silent --show-error \
              -H 'Cache-Control: no-cache' \
              "$XTREAM_URL/api/status?verify=${GITHUB_SHA}-${attempt}" \
              -o /tmp/webtv-xtream-status.json; then
              cat /tmp/webtv-xtream-status.json
              if node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/webtv-xtream-status.json','utf8'));process.exit(j.version==='1.7'&&j.service==='WebTV Xtream Bridge'&&j.registryBinding===true&&j.hlsProxy===true?0:1)"; then status_ok=1; fi
            fi
            preview_options=$(curl --silent --output /dev/null --write-out '%{http_code}' -X OPTIONS "$XTREAM_URL/api/preview?verify=${GITHUB_SHA}-${attempt}" || true)
            preview_auth=$(curl --silent --output /tmp/webtv-xtream-preview-auth.json --write-out '%{http_code}' -H 'content-type: application/json' -d '{}' "$XTREAM_URL/api/preview?verify=${GITHUB_SHA}-${attempt}" || true)
            cat /tmp/webtv-xtream-preview-auth.json 2>/dev/null || true
            cleanup_auth=$(curl --silent --output /tmp/webtv-xtream-cleanup-auth.json --write-out '%{http_code}' -X DELETE "$XTREAM_URL/api/channel-sources/xch_livegate12345678?verify=${GITHUB_SHA}-${attempt}" || true)
            cat /tmp/webtv-xtream-cleanup-auth.json 2>/dev/null || true
            if [ "$status_ok" = 1 ] && [ "$preview_options" = 204 ] && [ "$preview_auth" = 401 ] && [ "$cleanup_auth" = 401 ]; then
              exit 0
            fi
            echo "Waiting for Cloudflare propagation · attempt $attempt/30 · status=$status_ok options=$preview_options auth=$preview_auth cleanup=$cleanup_auth"
            sleep 3
          done
          echo '::error::Xtream Worker did not expose legacy bridge + Phase 5.2/5.3 auth boundaries after 90 seconds'
          exit 1
