name: Diagnose Browser Resolver ERT1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-browser-resolver-ert1.yml'

permissions:
  contents: read

env:
  BROWSER_URL: https://webtv-browser-resolver.atonis.workers.dev/resolve

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trace safe ERT1 browser API activity
        shell: bash
        env:
          RESOLVER_TOKEN: ${{ secrets.BROWSER_RESOLVER_SHARED_TOKEN }}
        run: |
          set -euo pipefail
          BODY='{"url":"https://live.ertflix.gr/live","channel":{"name":"ERT1","id":"ert1","originalId":"ERT1","tvgId":"ERT1"},"capture":{"extensions":["m3u8","mpd","mp4","webm"],"includeRequestHeaders":true,"timeoutMs":12000}}'
          HTTP=$(curl --silent --show-error -o resolver.json -w '%{http_code}' -X POST "$BROWSER_URL" \
            -H 'content-type: application/json' \
            -H "authorization: Bearer $RESOLVER_TOKEN" \
            --data "$BODY")
          echo "Browser Resolver HTTP $HTTP"
          node - <<'NODE'
          const fs=require('fs');
          const body=JSON.parse(fs.readFileSync('resolver.json','utf8'));
          const safeUrl=value=>{try{const u=new URL(String(value||''));return{host:u.hostname,pathname:u.pathname}}catch{return{host:'',pathname:''}}};
          const safe={
            service:body.service,
            version:body.version,
            error:body.error||'',
            diagnostics:body.diagnostics||{},
            apiObservations:(body.apiObservations||[]).map(x=>({
              phase:x.phase,
              resourceType:x.resourceType,
              method:x.method,
              host:x.host,
              pathname:x.pathname,
              queryNames:Array.isArray(x.queryNames)?x.queryNames:[],
              status:x.status,
              contentType:x.contentType
            })),
            apiResponseShapes:body.apiResponseShapes||[],
            mediaObservations:(body.observations||[]).map(x=>{
              const source=safeUrl(x.url),final=safeUrl(x.finalUrl);
              return{
                resourceType:x.resourceType,
                host:source.host,
                pathname:source.pathname,
                status:x.responseStatus,
                contentType:x.responseContentType,
                finalHost:final.host,
                finalPath:final.pathname,
                finalStatus:x.finalStatus,
                finalKind:x.finalKind,
                headerNames:Object.keys(x.headers||{})
              };
            })
          };
          console.log(JSON.stringify(safe,null,2));
          if(body.service!=='WebTV Browser Resolver')process.exit(1);
          if(body.version!=='1.7')process.exit(2);
          NODE
          test "$HTTP" = "200"

      - name: Validate direct official ERT stream API
        shell: bash
        run: |
          set -euo pipefail
          HTTP=$(curl --silent --show-error -o stream.json -w '%{http_code}' \
            -H 'accept: application/json' \
            -H 'referer: https://live.ertflix.gr/live/ert1' \
            -H 'user-agent: Mozilla/5.0 WebTV-OfficialApiDiagnostic/1.0' \
            'https://live.ertflix.gr/api/stream?channel=ert1')
          node - <<'NODE' "$HTTP"
          const fs=require('fs');
          const http=Number(process.argv[2]);
          let body={};
          try{body=JSON.parse(fs.readFileSync('stream.json','utf8'));}catch{}
          const safeUrl=value=>{try{const u=new URL(String(value||''));return{host:u.hostname,pathname:u.pathname}}catch{return{host:'',pathname:''}}};
          const safe={
            http,
            fields:body&&typeof body==='object'&&!Array.isArray(body)?Object.keys(body).sort():[],
            url:safeUrl(body?.url),
            primaryUrl:safeUrl(body?.primaryUrl),
            fallbackUrl:safeUrl(body?.fallbackUrl),
            type:typeof body?.type,
            source:typeof body?.source,
            updatedAt:typeof body?.updatedAt
          };
          console.log(JSON.stringify(safe,null,2));
          if(http!==200)process.exit(3);
          if(!safe.primaryUrl.host&&!safe.url.host)process.exit(4);
          NODE
