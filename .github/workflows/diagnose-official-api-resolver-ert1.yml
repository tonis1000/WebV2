name: Diagnose Official API Resolver ERT1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-official-api-resolver-ert1.yml'

permissions:
  contents: read

env:
  DISCOVERY_URL: https://webtv-source-discovery.atonis.workers.dev/discover

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect safe official API resolver result
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -X POST "$DISCOVERY_URL" \
            -H 'content-type: application/json' \
            --data '{"provider":"official-api-resolver","freshness":"7d","channel":{"name":"ERT1","id":"ert1","originalId":"ERT1","tvgId":"ERT1"}}' > result.json
          node - <<'NODE'
          const fs=require('fs');
          const body=JSON.parse(fs.readFileSync('result.json','utf8'));
          const safe={
            service:body.service,
            version:body.version,
            provider:body.provider,
            recognized:body.recognized,
            available:body.available,
            candidateCount:Array.isArray(body.candidates)?body.candidates.length:0,
            api:body.reports?.api||null,
            verification:body.reports?.verification||null,
            reason:body.reports?.reason||''
          };
          console.log(JSON.stringify(safe,null,2));
          if(body.provider!=='official-api-resolver')process.exit(1);
          if(body.recognized!==true)process.exit(2);
          if(body.reports?.api?.status!==200)process.exit(3);
          NODE

      - name: Compare GitHub runner CDN access safely
        shell: bash
        run: |
          set -euo pipefail
          API_HTTP=$(curl --silent --show-error -D api-headers.txt -o stream.json -w '%{http_code}' \
            -H 'accept: application/json' \
            -H 'referer: https://live.ertflix.gr/live/ert1' \
            -H 'origin: https://live.ertflix.gr' \
            -H 'user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/153.0.0.0 Safari/537.36' \
            'https://live.ertflix.gr/api/stream?channel=ert1')
          node - <<'NODE' "$API_HTTP"
          const fs=require('fs');
          const apiHttp=Number(process.argv[2]);
          let body={};try{body=JSON.parse(fs.readFileSync('stream.json','utf8'));}catch{}
          const media=String(body?.primaryUrl||body?.url||'');
          if(apiHttp!==200||!media)process.exit(10);
          fs.writeFileSync('media-url.txt',media,{mode:0o600});
          const u=new URL(media);
          console.log(JSON.stringify({apiHttp,media:{host:u.hostname,pathname:u.pathname,queryCount:[...u.searchParams.keys()].length,queryKeys:[...new Set(u.searchParams.keys())].sort()}},null,2));
          NODE
          MEDIA_URL=$(cat media-url.txt)
          FIRST_HTTP=$(curl --silent --show-error --max-redirs 0 -D first-headers.txt -o /dev/null -w '%{http_code}' \
            -H 'referer: https://live.ertflix.gr/live/ert1' \
            -H 'origin: https://live.ertflix.gr' \
            -H 'user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/153.0.0.0 Safari/537.36' \
            "$MEDIA_URL" || true)
          node - <<'NODE' "$FIRST_HTTP"
          const fs=require('fs');
          const status=Number(process.argv[2]);
          const lines=fs.readFileSync('first-headers.txt','utf8').split(/\r?\n/);
          const headers={};for(const line of lines){const i=line.indexOf(':');if(i>0){const k=line.slice(0,i).trim().toLowerCase();const v=line.slice(i+1).trim();headers[k]=v;}}
          const names=Object.keys(headers).sort();
          let redirect={host:'',pathname:'',queryCount:0,queryKeys:[]};
          if(headers.location){try{const u=new URL(headers.location);redirect={host:u.hostname,pathname:u.pathname,queryCount:[...u.searchParams.keys()].length,queryKeys:[...new Set(u.searchParams.keys())].sort()};fs.writeFileSync('redirect-url.txt',u.href,{mode:0o600});}catch{}}
          console.log(JSON.stringify({firstStatus:status,responseHeaderNames:names,hasSetCookie:names.includes('set-cookie'),hasWwwAuthenticate:names.includes('www-authenticate'),redirect},null,2));
          if(!redirect.host)process.exit(11);
          NODE
          REDIRECT_URL=$(cat redirect-url.txt)
          FINAL_HTTP=$(curl --silent --show-error --max-redirs 0 -D final-headers.txt -o /dev/null -w '%{http_code}' \
            -H 'referer: https://live.ertflix.gr/live/ert1' \
            -H 'origin: https://live.ertflix.gr' \
            -H 'user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/153.0.0.0 Safari/537.36' \
            "$REDIRECT_URL" || true)
          node - <<'NODE' "$FINAL_HTTP"
          const fs=require('fs');
          const status=Number(process.argv[2]);
          const lines=fs.readFileSync('final-headers.txt','utf8').split(/\r?\n/);
          const names=[...new Set(lines.map(line=>{const i=line.indexOf(':');return i>0?line.slice(0,i).trim().toLowerCase():'';}).filter(Boolean))].sort();
          console.log(JSON.stringify({finalStatus:status,responseHeaderNames:names,hasSetCookie:names.includes('set-cookie'),hasWwwAuthenticate:names.includes('www-authenticate')},null,2));
          NODE
          rm -f media-url.txt redirect-url.txt stream.json api-headers.txt first-headers.txt final-headers.txt
