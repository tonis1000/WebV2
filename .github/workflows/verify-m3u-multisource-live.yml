name: Verify M3U Multi-source Live

on:
  pull_request:
    paths:
      - '.github/workflows/verify-m3u-multisource-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DISCOVERY_URL: https://webtv-source-discovery.atonis.workers.dev
    steps:
      - name: Verify real jimgate multi-source candidates
        shell: bash
        run: |
          set -euo pipefail

          probe() {
            local channel="$1"
            local outfile="$2"
            local id
            id=$(printf '%s' "$channel" | tr '[:upper:]' '[:lower:]')
            curl --fail --silent --show-error -X POST "$DISCOVERY_URL/discover" \
              -H 'content-type: application/json' \
              --data "{\"provider\":\"curated-remote-feeds\",\"freshness\":\"24h\",\"channel\":{\"name\":\"$channel\",\"id\":\"$id\"}}" \
              -o "$outfile"
          }

          probe MEGA /tmp/mega.json
          probe ALPHA /tmp/alpha.json
          probe ERT3 /tmp/ert3.json

          node <<'NODE'
          const fs=require('fs');
          function inspect(path,name,minFeedCount){
            const body=JSON.parse(fs.readFileSync(path,'utf8'));
            const report=(body.reports||[]).find(x=>x.feed==='jimgate07/grtv multi');
            const rows=body.candidates||[];
            console.log('\n'+name+' final candidates:');
            for(const row of rows) console.log(JSON.stringify({type:row.sourceType,url:row.sourceUrl,origin:row.sourceOrigin}));
            console.log(name+' jimgate07/grtv multi report count='+(report?.count??'missing'));
            if(!report||report.count<minFeedCount) throw new Error(name+' expected jimgate multi report count >= '+minFeedCount+', got '+String(report?.count));
            return rows;
          }
          const mega=inspect('/tmp/mega.json','MEGA',3);
          const alpha=inspect('/tmp/alpha.json','ALPHA',3);
          const ert3=inspect('/tmp/ert3.json','ERT3',4);

          if(!mega.some(x=>String(x.sourceUrl).includes('15.235.41.196/hls/mega.m3u8')&&String(x.sourceUrl).includes('x-roku-reserved-dev-id='))) throw new Error('MEGA Roku header-bearing alternative missing from final candidates');
          if(!mega.some(x=>String(x.sourceUrl).includes('spark3.smart-tv-data.com/megaHD/megaHD/manifest.mpd'))) throw new Error('MEGA DASH alternative missing from final candidates');
          if(alpha.filter(x=>String(x.sourceUrl).includes('alphatvlive2.siliconweb.com')).length<2) throw new Error('ALPHA alternatives missing from final candidates');
          if(ert3.filter(x=>x.sourceType==='hls').length<3) throw new Error('ERT3 alternatives missing from final candidates');

          console.log('\nLIVE_MULTI_SOURCE_ACCEPTANCE=PASS');
          NODE
