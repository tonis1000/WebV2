name: Deploy Source Hunt Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'workers/source-huntatonisworkersdev.js'
      - 'workers/source-hunt-smart.js'
      - 'workers/source-hunt-bouquet-proxy.js'
      - 'src/core/channel-identity-gr.js'
      - 'src/core/source-candidate-url.js'
      - 'src/core/m3u-container.js'
      - 'src/core/strm-core.js'
      - 'tests/channel-identity-core.test.mjs'
      - 'tests/m3u-container-core.test.mjs'
      - 'tests/strm-core.test.mjs'
      - 'tests/source-hunt-m3u-parity.test.mjs'
      - 'tests/candidate-url-sanitizer.test.mjs'
      - 'tests/source-hunt-strm-parity.test.mjs'
      - 'tests/source-hunt-xtream-leads.test.mjs'
      - '.github/workflows/deploy-source-hunt.yml'

permissions:
  contents: read

concurrency:
  group: deploy-source-hunt
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: c2275f5f50ccabe425a5cafe68128a9a
  WORKER_NAME: source-huntatonisworkersdev
  WORKER_URL: https://source-huntatonisworkersdev.atonis.workers.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Validate source
        run: |
          node --check workers/source-huntatonisworkersdev.js
          node --check workers/source-hunt-smart.js
          node --check workers/source-hunt-bouquet-proxy.js
          node --check src/core/channel-identity-gr.js
          node --check src/core/source-candidate-url.js
          node --check src/core/m3u-container.js
          node --check src/core/strm-core.js
          node tests/channel-identity-core.test.mjs
          node tests/candidate-url-sanitizer.test.mjs
          node tests/m3u-container-core.test.mjs
          node tests/strm-core.test.mjs
          node tests/source-hunt-m3u-parity.test.mjs
          node tests/source-hunt-strm-parity.test.mjs
          node tests/source-hunt-xtream-leads.test.mjs

      - name: Build Wrangler config
        shell: bash
        run: |
          cat > wrangler.source-hunt.ci.toml <<'EOF'
          name = "source-huntatonisworkersdev"
          main = "workers/source-hunt-bouquet-proxy.js"
          compatibility_date = "2026-09-20"
          workers_dev = true
          preview_urls = false
          keep_vars = true
          EOF

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.source-hunt.ci.toml

      - name: Verify live Worker
        shell: bash
        run: |
          set -euo pipefail
          HANS='https://gitlab.openpli.org/openpli/hanssettings/-/raw/master/e2_hanssettings_9e_13e_19e_23e_28e_AND_rotating/userbouquet.stream_griekenland__gr_.tv?ref_type=heads'
          for attempt in $(seq 1 12); do
            curl --fail --silent --show-error "$WORKER_URL/?verify=$GITHUB_SHA" -o /tmp/source-hunt-status.json || true
            ROOT_OK=0
            if node -e "const fs=require('fs');try{const j=JSON.parse(fs.readFileSync('/tmp/source-hunt-status.json','utf8'));process.exit(j.service==='WebTV Source Hunt Worker'&&j.version==='1.15'&&j.costPolicy==='free-first'&&Array.isArray(j.features)&&j.features.includes('GitHub issue labels/state intelligence')&&j.features.includes('free-first default')&&j.features.includes('explicit Brave fallback')?0:1)}catch{process.exit(1)}"; then ROOT_OK=1; fi
            FREE_HUNT_OK=0
            if curl --fail --silent --show-error "$WORKER_URL/hunt?channel=MEGA&days=30" -o /tmp/source-hunt-free.json && node -e "const fs=require('fs');try{const j=JSON.parse(fs.readFileSync('/tmp/source-hunt-free.json','utf8'));process.exit(j.paidSearchEnabled===false?0:1)}catch{process.exit(1)}"; then FREE_HUNT_OK=1; fi
            BOUQUET_OK=0
            if curl --fail --silent --show-error --get --data-urlencode "url=$HANS" "$WORKER_URL/bouquet-proxy" -o /tmp/hans.tv && grep -q '^#SERVICE ' /tmp/hans.tv; then BOUQUET_OK=1; fi
            if [ "$ROOT_OK" = 1 ] && [ "$FREE_HUNT_OK" = 1 ] && [ "$BOUQUET_OK" = 1 ]; then
              cat /tmp/source-hunt-status.json
              echo "Source Hunt v1.15 free-first + Enigma2 bouquet proxy are live."
              exit 0
            fi
            echo "Waiting for Cloudflare propagation ($attempt/12)… root=$ROOT_OK free_hunt=$FREE_HUNT_OK bouquet=$BOUQUET_OK"
            sleep 5
          done
          echo "::error::Source Hunt or bouquet proxy verification failed"
          cat /tmp/source-hunt-status.json 2>/dev/null || true
          exit 1
