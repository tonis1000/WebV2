<!doctype html>
<html>
<head><meta charset="utf-8"><title>Unified Search Discovery Browser Smoke</title></head>
<body>
  <aside id="sidebar-sentinel">SIDEBAR-STABLE</aside>
  <section id="player-sentinel">PLAYER-STABLE</section>
  <pre id="result"></pre>
  <script>
    localStorage.setItem('webtv_v2_registry_token','fixture-session');
    window.__probe={d1Writes:0};
    window.WebTVRegistryAuth={ensureSession:async()=>true};
    window.fetch=async(url,options={})=>{
      const target=String(url);
      const method=String(options.method||'GET').toUpperCase();
      if(method!=='GET' && target.includes('webtv-registry.atonis.workers.dev')){
        window.__probe.d1Writes++;
      }
      if(target.includes('webtv-xtream.atonis.workers.dev/api/accounts')){
        const headers=new Headers(options.headers||{});
        if(headers.get('x-webtv-session')!=='fixture-session')return new Response(JSON.stringify({error:'missing session'}),{status:401,headers:{'content-type':'application/json'}});
        if(/\/api\/accounts\/xt-auth\/channels$/.test(target))return new Response(JSON.stringify({account:{id:'xt-auth',name:'Authorized Fixture',server:'https://authorized-provider.test'},channels:[{id:'xtream:xt-auth:501',streamId:'501',tvgId:'MEGA',name:'MEGA HD',group:'Greece',playbackUrl:'https://webtv-xtream.atonis.workers.dev/stream/xt-auth/501.m3u8?s=opaque-fixture'}]}),{status:200,headers:{'content-type':'application/json'}});
        if(/\/api\/accounts$/.test(target))return new Response(JSON.stringify({accounts:[{id:'xt-auth',name:'Authorized Fixture',server:'https://authorized-provider.test'}]}),{status:200,headers:{'content-type':'application/json'}});
      }
      if(target.includes('webtv-source-discovery')){
        const body=JSON.parse(options.body||'{}');
        const provider=body.provider;
        const urls={
          'curated-remote-feeds':'https://curated.test/mega.m3u8',
          'github-public-playlists':'https://github.test/mega.m3u8',
          'recent-web-search':'https://web.test/mega.m3u8',
          'strm-specific-discovery':'https://strm.test/mega.m3u8'
        };
        return new Response(JSON.stringify({provider,recognized:true,available:true,candidates:[{channelName:'MEGA',sourceType:'hls',sourceUrl:urls[provider]||'https://external.test/mega.m3u8',sourceOrigin:'fixture',discoveryProvider:provider,verificationStatus:'UNVERIFIED',matchConfidence:'HIGH',candidateKind:'media',saveEligible:true}],reports:[]}),{status:200,headers:{'content-type':'application/json'}});
      }
      if(target.includes('webtv-source-verifier')){
        const body=JSON.parse(options.body||'{}');
        return new Response(JSON.stringify({results:(body.candidates||[]).map(candidate=>({candidateId:candidate.candidateId,status:'VERIFIED',verified:true,startupMs:18,lastHttpStatus:200,mediaType:'hls',drmDetected:false,detail:'Manifest/media probe succeeded'}))}),{status:200,headers:{'content-type':'application/json'}});
      }
      return new Response(JSON.stringify({ok:true}),{status:200,headers:{'content-type':'application/json'}});
    };
  </script>
  <script type="module">
    const sidebar=document.getElementById('sidebar-sentinel');
    const player=document.getElementById('player-sentinel');
    const before={sidebar:sidebar.textContent,player:player.textContent};
    try{
      const {listUnifiedSearchLanes,getUnifiedSearchRuntimeAdapter}=await import('../src/search/search-runtime.js');
      const {verifyCandidates}=await import('../src/discovery/verifier-client.js');
      const target={id:'mega',originalId:'MEGA',tvgId:'MEGA',name:'MEGA'};
      const lanes=listUnifiedSearchLanes().filter(l=>l.type==='discovery-provider');
      const expected=['curated-remote-feeds','github-public-playlists','recent-web-search','strm-specific-discovery','authorized-xtream'];
      const laneIds=lanes.map(l=>l.id);
      const results=[];
      for(const lane of lanes){
        const adapter=getUnifiedSearchRuntimeAdapter(lane.type);
        const result=await adapter.search({target,source:lane});
        results.push({lane:lane.id,count:result.candidates.length,candidates:result.candidates});
      }
      const candidates=results.flatMap(r=>r.candidates);
      const externalCandidates=candidates.filter(c=>c.discoveryProvider!=='authorized-xtream-expansion');
      const verified=await verifyCandidates(externalCandidates);
      const pass=
        expected.every(id=>laneIds.includes(id)) &&
        results.every(r=>r.count===1) &&
        candidates.some(c=>c.discoveryProvider==='authorized-xtream-expansion') &&
        verified.length===externalCandidates.length &&
        verified.every(v=>v.verified===true) &&
        window.__probe.d1Writes===0 &&
        sidebar.textContent===before.sidebar &&
        player.textContent===before.player;
      document.documentElement.dataset.phase4Result=pass?'PASS':'FAIL';
      document.getElementById('result').textContent=JSON.stringify({pass,laneIds,counts:results.map(r=>[r.lane,r.count]),verified:verified.length,d1Writes:window.__probe.d1Writes});
    }catch(error){
      document.documentElement.dataset.phase4Result='FAIL';
      document.getElementById('result').textContent=String(error?.stack||error);
    }
  </script>
</body>
</html>
