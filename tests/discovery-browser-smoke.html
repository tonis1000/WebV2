<!doctype html>
<html>
<head><meta charset="utf-8"><title>Discovery Phase 5 Browser Smoke</title><style>:root{--text:#fff;--muted:#999;--accent-2:#63b3ff;--line:#333}.button{padding:4px}.ghost{opacity:.9}</style></head>
<body>
  <div class="topbar-actions"><button id="source-hunt-toggle" class="button">Source Hunt</button></div>
  <aside id="sidebar-sentinel">SIDEBAR-STABLE</aside>
  <section id="player-sentinel">PLAYER-STABLE</section>
  <pre id="result"></pre>
  <script>
    localStorage.setItem('webtv_v2_registry_token','fixture-session');
    window.__promotionProbe={d1Writes:0,reloads:0,lastPayload:null};
    window.WebTVRegistryAuth={ensureSession:async()=>true};
    window.WebTVPlaylistAPI={
      getSelectedChannel:()=>({id:'mega',originalId:'MEGA',tvgId:'MEGA',name:'MEGA',group:'General',directUrls:['https://current.test/mega.m3u8']}),
      getCatalogMode:()=> 'cloud',
      getChannels:()=>[{id:'mega',originalId:'MEGA',name:'MEGA',group:'General',directUrls:['https://current.test/mega.m3u8']},{id:'skai',originalId:'SKAI',name:'SKAI',group:'General',directUrls:['https://current.test/skai.m3u8']}],
    };
    window.WebTVMyPlaylistAPI={getMyPlaylist:async()=>[],reload:async()=>{window.__promotionProbe.reloads++;}};
    window.WebTVSavedPlaylistsReadAPI={getAllCached:async()=>[{id:'saved-1',name:'Greek backup',type:'saved',text:'#EXTM3U\n#EXTINF:-1 tvg-id="MEGA" tvg-name="MEGA",MEGA\nhttps://backup.test/mega.mpd\n',updatedAt:Date.now()}]};
    window.WebTVXtream={getLoaded:()=>({account:{id:'xt-1',name:'Provider A',server:'https://provider.test'},channels:[{id:'xtream:xt-1:42',streamId:'42',tvgId:'MEGA',name:'MEGA',group:'General',playbackUrl:'https://webtv-xtream.test/stream/xt-1/42.m3u8?s=signed'}]})};
    window.fetch=async(url,options={})=>{
      const target=String(url);
      if(target.includes('webtv-registry.atonis.workers.dev/api/my-playlist/channel')){
        window.__promotionProbe.d1Writes++;window.__promotionProbe.lastPayload=JSON.parse(options.body||'{}');
        return new Response(JSON.stringify({ok:true}),{status:200,headers:{'content-type':'application/json'}});
      }
      if(target.includes('webtv-xtream.atonis.workers.dev/api/accounts')){
        const headers=new Headers(options.headers||{});if(headers.get('x-webtv-session')!=='fixture-session')return new Response(JSON.stringify({error:'missing session'}),{status:401,headers:{'content-type':'application/json'}});
        if(/\/api\/accounts\/xt-auth\/channels$/.test(target))return new Response(JSON.stringify({account:{id:'xt-auth',name:'Authorized Fixture',server:'https://authorized-provider.test'},channels:[{id:'xtream:xt-auth:501',streamId:'501',tvgId:'MEGA',name:'MEGA HD',group:'Greece',playbackUrl:'https://webtv-xtream.atonis.workers.dev/stream/xt-auth/501.m3u8?s=opaque-fixture'},{id:'xtream:xt-auth:999',streamId:'999',tvgId:'MEGA-NEWS',name:'MEGA News',group:'Greece',playbackUrl:'https://webtv-xtream.atonis.workers.dev/stream/xt-auth/999.m3u8?s=opaque-news'}]}),{status:200,headers:{'content-type':'application/json'}});
        if(/\/api\/accounts$/.test(target))return new Response(JSON.stringify({accounts:[{id:'xt-auth',name:'Authorized Fixture',server:'https://authorized-provider.test'}]}),{status:200,headers:{'content-type':'application/json'}});
      }
      if(target.includes('webtv-source-discovery')){
        const body=JSON.parse(options.body||'{}');
        const github=body.provider==='github-public-playlists';const web=body.provider==='recent-web-search';const strm=body.provider==='strm-specific-discovery';const official=body.provider==='official-provider-lane';
        const sourceUrl=github?'https://github-external.test/mega.m3u8':web?'https://web-external.test/mega.m3u8':strm?'https://strm-resolved.test/mega.m3u8':official?'https://official.test/mega/live':'https://external.test/mega.m3u8';
        const sourceOrigin=github?'github:fixture/recent/playlist.m3u':web?'web:fixture.test':strm?'strm:fixture-feed':official?'official:fixture':'fixture-feed';
        const freshness=github?'repo-pushed:2026-09-26T00:00:00Z':web?'brave-window:7d':strm?'live-strm-check':'live-feed-check';
        return new Response(JSON.stringify({service:'WebTV Source Discovery',version:'1.4',provider:body.provider,freshnessRequested:body.freshness||'7d',freshnessApplied:github||web,candidates:[{channelName:'MEGA',sourceType:official?'direct':'hls',sourceUrl,sourceOrigin,discoveryProvider:body.provider,freshness:official?'live-official-check':freshness,matchConfidence:web?'MEDIUM':'HIGH',candidateKind:official?'official-page':'media',trustClass:official?'OFFICIAL':'',saveEligible:!official}],reports:[]}),{status:200,headers:{'content-type':'application/json'}});
      }
      const body=JSON.parse(options.body||'{}');const candidate=body.candidates?.[0]||{};const dead=String(candidate.sourceUrl||'').includes('backup.test');
      return new Response(JSON.stringify({results:[{candidateId:candidate.candidateId,status:dead?'HTTP 404':'VERIFIED',verified:!dead,startupMs:dead?31:18,lastHttpStatus:dead?404:200,mediaType:dead?'':'hls',drmDetected:false,detail:dead?'Upstream HTTP 404':'Manifest/media probe succeeded'}]}),{status:200,headers:{'content-type':'application/json'}});
    };
  </script>
  <script type="module">
    const sidebar=document.getElementById('sidebar-sentinel');const player=document.getElementById('player-sentinel');const before={sidebar:sidebar.textContent,player:player.textContent};
    try{
      await import('../src/discovery/discovery-ui.js');const api=window.WebTVDiscovery;api.open();const opened=api.snapshot();await api.scanLocal();const local=api.snapshot();await api.scanExternal();const curated=api.snapshot();await api.scanGithub();const github=api.snapshot();await api.scanRecentWeb();const web=api.snapshot();await api.scanStrm();const strm=api.snapshot();await api.scanOfficial();const official=api.snapshot();await api.scanAuthorizedXtream();const xtream=api.snapshot();const cardCount=document.querySelectorAll('#discovery-results .discovery-card').length;const writesBeforeVerify=window.__promotionProbe.d1Writes;const promoteButtonsBeforeVerify=document.querySelectorAll('.discovery-promote-source').length;await api.verifyAll();const verified=api.snapshot();const authorizedVerified=verified.candidates.find(x=>x.discoveryProvider==='authorized-xtream-expansion');const promoteButtonsAfterVerify=document.querySelectorAll('.discovery-promote-source').length;await api.promoteOne(authorizedVerified.candidateId);const writesAfterPromote=window.__promotionProbe.d1Writes;const reloadsAfterPromote=window.__promotionProbe.reloads;const savedPayload=window.__promotionProbe.lastPayload;await api.keepXtreamAccount(authorizedVerified.candidateId);const writesAfterAccountKeep=window.__promotionProbe.d1Writes;const promotionCardText=document.querySelector(`[data-candidate-id="${authorizedVerified.candidateId}"]`)?.textContent||'';document.querySelector('[data-freshness="24h"]')?.click();const changed=api.snapshot();api.close();const closed=api.snapshot();
      const verifiedCount=verified.candidates.filter(x=>x.verificationStatus==='VERIFIED').length;const failedCount=verified.candidates.filter(x=>x.verificationStatus==='HTTP 404').length;const curatedCandidate=xtream.candidates.find(x=>x.discoveryProvider==='curated-remote-feeds');const githubCandidate=xtream.candidates.find(x=>x.discoveryProvider==='github-public-playlists');const webCandidate=xtream.candidates.find(x=>x.discoveryProvider==='recent-web-search');const strmCandidate=xtream.candidates.find(x=>x.discoveryProvider==='strm-specific-discovery');const officialCandidate=xtream.candidates.find(x=>x.discoveryProvider==='official-provider-lane');const authorizedXtreamCandidate=xtream.candidates.find(x=>x.discoveryProvider==='authorized-xtream-expansion');
      const savedUrls=savedPayload?.directUrls||[];
      const pass=Boolean(api&&opened.open===true&&opened.channel?.name==='MEGA'&&opened.freshness==='7d'&&opened.candidates.length===0&&local.scanStatus==='done'&&local.lanes.myPlaylist===1&&local.lanes.savedPlaylists===1&&local.lanes.xtream===1&&local.lanes.total===3&&curated.externalStatus==='done'&&curated.lanes.curatedRemoteFeeds===1&&curated.lanes.total===4&&github.externalStatus==='done'&&github.lanes.githubPublicPlaylists===1&&github.lanes.total===5&&web.externalStatus==='done'&&web.lanes.recentWebSearch===1&&web.lanes.total===6&&strm.externalStatus==='done'&&strm.lanes.strmSpecific===1&&strm.lanes.total===7&&official.externalStatus==='done'&&official.lanes.officialProvider===1&&official.lanes.total===8&&xtream.externalStatus==='done'&&xtream.lanes.authorizedXtream===1&&xtream.lanes.total===9&&xtream.candidates.length===9&&curatedCandidate?.verificationStatus==='UNVERIFIED'&&githubCandidate?.verificationStatus==='UNVERIFIED'&&webCandidate?.verificationStatus==='UNVERIFIED'&&strmCandidate?.verificationStatus==='UNVERIFIED'&&officialCandidate?.candidateKind==='official-page'&&officialCandidate?.trustClass==='OFFICIAL'&&officialCandidate?.saveEligible===false&&authorizedXtreamCandidate?.sourceType==='xtream'&&authorizedXtreamCandidate?.xtreamAccountRef==='xt-auth'&&authorizedXtreamCandidate?.xtreamStreamId==='501'&&authorizedXtreamCandidate?.xtreamContext?.username===''&&authorizedXtreamCandidate?.xtreamContext?.password===''&&webCandidate?.matchConfidence==='MEDIUM'&&cardCount===9&&writesBeforeVerify===0&&promoteButtonsBeforeVerify===0&&verified.verifyStatus==='done'&&verifiedCount===7&&failedCount===1&&officialCandidate?.verificationStatus==='UNVERIFIED'&&promoteButtonsAfterVerify>=1&&writesAfterPromote===1&&reloadsAfterPromote===1&&writesAfterAccountKeep===1&&savedUrls.includes(authorizedVerified.sourceUrl)&&promotionCardText.includes('Full Xtream account already stored securely')&&promotionCardText.includes('stream ID: 501')&&changed.freshness==='24h'&&closed.open===false&&document.getElementById('discovery-shell')?.hidden===true&&sidebar.textContent===before.sidebar&&player.textContent===before.player);
      document.documentElement.dataset.phase4Result=pass?'PASS':'FAIL';document.getElementById('result').textContent=JSON.stringify({pass,cardCount,verifiedCount,failedCount,writesBeforeVerify,promoteButtonsBeforeVerify,promoteButtonsAfterVerify,writesAfterPromote,reloadsAfterPromote,writesAfterAccountKeep,savedPayload,promotionCardText,opened,local,curated,github,web,strm,official,xtream,verified,changed,closed,sidebar:sidebar.textContent,player:player.textContent});
    }catch(error){document.documentElement.dataset.phase4Result='ERROR';document.getElementById('result').textContent=String(error?.stack||error);}
  </script>
</body>
</html>
