    };

        window.__promotionProbe.d1Writes++;window.__promotionProbe.lastPayload=JSON.parse(options.body||'{}');

      }

        const headers=new Headers(options.headers||{});if(headers.get('x-webtv-session')!=='fixture-session')return new Response(JSON.stringify({error:'missing session'}),{status:401,headers:{'content-type':'application/json'}});

      }
      if(target.includes('webtv-xtream.atonis.workers.dev/api/accounts/from-preview')){

      }
      if(target.includes('webtv-xtream.atonis.workers.dev/api/accounts')){

      }
      if(target.includes('webtv-source-discovery')){
        const body=JSON.parse(options.body||'{}');
        const github=body.provider==='github-public-playlists';const web=body.provider==='recent-web-search';const strm=body.provider==='strm-specific-discovery';const official=body.provider==='official-provider-lane';
        const sourceUrl=github?'https://github-external.test/mega.m3u8':web?'https://web-external.test/mega.m3u8':strm?'https://strm-resolved.test/mega.m3u8':official?'https://official.test/mega/live':'https://external.test/mega.m3u8';
        const sourceOrigin=github?'github:fixture/recent/playlist.m3u':web?'web:fixture.test':strm?'strm:fixture-feed':official?'official:fixture':'fixture-feed';
        const freshness=github?'repo-pushed:2026-09-26T00:00:00Z':web?'brave-window:7d':strm?'live-strm-check':'live-feed-check';
        return new Response(JSON.stringify({service:'WebTV Source Discovery',version:'1.4',provider:body.provider,freshnessRequested:body.freshness||'7d',freshnessApplied:github||web,candidates:[{channelName:'MEGA',sourceType:official?'direct':'hls',sourceUrl,sourceOrigin,discoveryProvider:body.provider,freshness:official?'live-official-check':freshness,matchConfidence:web?'MEDIUM':'HIGH',candidateKind:official?'official-page':'media',trustClass:official?'OFFICIAL':'',saveEligible:!official}],reports:[]}),{status:200,headers:{'content-type':'application/json'}});
      }
      const body=JSON.parse(options.body||'{}');const candidate=body.candidates?.[0]||{};const dead=String(candidate.sourceUrl||'').includes('backup.test');
      return new Response(JSON.stringify({results:[{candidateId:candidate.candidateId,status:dead?'HTTP 404':'VERIFIED',verified:!dead,startupMs:dead?31:18,lastHttpStatus:dead?404:200,mediaType:dead?'':'hls',drmDetected:false,detail:dead?'Upstream HTTP 404':'Manifest/media probe succeeded'}]}),{status:200,headers:{'content-type':'application/json'}});
    };
  </script>
  <script type="module">

      await import('../src/discovery/discovery-ui.js');const api=window.WebTVDiscovery;api.open();const opened=api.snapshot();await api.scanLocal();const local=api.snapshot();await api.scanExternal();const curated=api.snapshot();await api.scanGithub();const github=api.snapshot();await api.scanRecentWeb();const web=api.snapshot();await api.scanStrm();const strm=api.snapshot();await api.scanOfficial();const official=api.snapshot();await api.scanAuthorizedXtream();const xtream=api.snapshot();

      await api.promoteOne(authorizedVerified.candidateId);const writesAfterAuthorizedPromote=window.__promotionProbe.d1Writes;const reloadsAfterAuthorizedPromote=window.__promotionProbe.reloads;await api.keepXtreamAccount(authorizedVerified.candidateId);const writesAfterAccountKeep=window.__promotionProbe.d1Writes;

      const verifiedCount=verified.candidates.filter(x=>x.verificationStatus==='VERIFIED').length;const failedCount=verified.candidates.filter(x=>x.verificationStatus==='HTTP 404').length;const curatedCandidate=preview.candidates.find(x=>x.discoveryProvider==='curated-remote-feeds');const githubCandidate=preview.candidates.find(x=>x.discoveryProvider==='github-public-playlists');const webCandidate=preview.candidates.find(x=>x.discoveryProvider==='recent-web-search');const strmCandidate=preview.candidates.find(x=>x.discoveryProvider==='strm-specific-discovery');const officialCandidate=preview.candidates.find(x=>x.discoveryProvider==='official-provider-lane');const authorizedXtreamCandidate=preview.candidates.find(x=>x.discoveryProvider==='authorized-xtream-expansion');
      const channelOnlyUrls=channelOnlyPayload?.directUrls||[];
      const pass=Boolean(api&&opened.open===true&&opened.channel?.name==='MEGA'&&opened.freshness==='7d'&&opened.candidates.length===0&&local.scanStatus==='done'&&local.lanes.myPlaylist===1&&local.lanes.savedPlaylists===1&&local.lanes.xtream===1&&local.lanes.total===3&&curated.externalStatus==='done'&&curated.lanes.curatedRemoteFeeds===1&&curated.lanes.total===4&&github.externalStatus==='done'&&github.lanes.githubPublicPlaylists===1&&github.lanes.total===5&&web.externalStatus==='done'&&web.lanes.recentWebSearch===1&&web.lanes.total===6&&strm.externalStatus==='done'&&strm.lanes.strmSpecific===1&&strm.lanes.total===7&&official.externalStatus==='done'&&official.lanes.officialProvider===1&&official.lanes.total===8&&xtream.externalStatus==='done'&&xtream.lanes.authorizedXtream===1&&xtream.lanes.total===9&&preview.externalStatus==='done'&&preview.lanes.newXtreamPreview===1&&preview.lanes.total===10&&preview.candidates.length===10&&previewCandidate?.sourceType==='xtream-preview'&&previewCandidate?.xtreamStreamId==='777'&&previewCandidate?.xtreamPreviewToken==='opaque-preview-fixture'&&previewCandidate?.saveEligible===false&&previewFieldsCleared&&window.__promotionProbe.previewCalls===1&&window.__promotionProbe.previewBody?.username==='fixture-user-secret'&&window.__promotionProbe.previewBody?.password==='fixture-pass-secret'&&!previewSerialized.includes('fixture-user-secret')&&!previewSerialized.includes('fixture-pass-secret')&&curatedCandidate?.verificationStatus==='UNVERIFIED'&&githubCandidate?.verificationStatus==='UNVERIFIED'&&webCandidate?.verificationStatus==='UNVERIFIED'&&strmCandidate?.verificationStatus==='UNVERIFIED'&&officialCandidate?.candidateKind==='official-page'&&officialCandidate?.trustClass==='OFFICIAL'&&officialCandidate?.saveEligible===false&&authorizedXtreamCandidate?.sourceType==='xtream'&&authorizedXtreamCandidate?.xtreamAccountRef==='xt-auth'&&authorizedXtreamCandidate?.xtreamStreamId==='501'&&authorizedXtreamCandidate?.xtreamContext?.username===''&&authorizedXtreamCandidate?.xtreamContext?.password===''&&webCandidate?.matchConfidence==='MEDIUM'&&cardCount===10&&writesBeforeVerify===0&&channelSecretsBeforeVerify===0&&fullAccountsBeforeVerify===0&&promoteButtonsBeforeVerify===0&&previewButtonsBeforeVerify===0&&verified.verifyStatus==='done'&&verifiedCount===8&&failedCount===1&&officialCandidate?.verificationStatus==='UNVERIFIED'&&promoteButtonsAfterVerify>=1&&channelButtonsAfterVerify===1&&fullButtonsAfterVerify===1&&writesAfterAuthorizedPromote===1&&reloadsAfterAuthorizedPromote===1&&writesAfterAccountKeep===1&&writesAfterChannelOnly===2&&channelSecretWrites===1&&reloadsAfterChannelOnly===2&&channelOnlyUrls.includes('https://webtv-xtream.atonis.workers.dev/channel-stream/xch_fixture/777.m3u8?s=permanent-signed')&&writesAfterFullAccount===2&&fullAccountWrites===1&&authorizedCardText.includes('Full Xtream account already stored securely')&&channelOnlyCardText.includes('Channel-only Xtream source saved')&&previewCardText.includes('Full Xtream account saved securely')&&!channelOnlyCardText.includes('fixture-user-secret')&&!channelOnlyCardText.includes('fixture-pass-secret')&&!previewCardText.includes('fixture-user-secret')&&!previewCardText.includes('fixture-pass-secret')&&changed.freshness==='24h'&&closed.open===false&&document.getElementById('discovery-shell')?.hidden===true&&sidebar.textContent===before.sidebar&&player.textContent===before.player);
